# Change log. D-RCV-60, 26 November 2026: cross-document changes under the programme directive. Tool: T3 Code / OpenCode / DeepSeek v4.1 Flash.
# Recovery Workbench API specification v4. Henka Group, 16 November 2026.
openapi: 3.1.0
info:
  title: Recovery Workbench API
  version: 4.0.0
  description: 'Endpoints of the recovery module in the ACE service. Every endpoint checks the role, the capability area, the right and the scope. Version 4.0.0, 16 November 2026: rule packages in embedded Drools replace rule versions (D-RCV-36, T3 to T5); the three former rule-version paths become the seven rule-package paths and POST /admin/workflows/smoke is added. Version 3.0.0, 15 November 2026: re-based on the ACE database under D-RCV-35 (U1 to U5). The Workbench takes no inbound source data; source
    records are read only through the SELECT-only recovery.v_ace_* views and linked by ACE business keys (account_key, person_key, payment_code,
    contact_key, asset_key, valuation_key) with no foreign key into ACE. Removed: the tracker endpoints (/admin/trackers and its sub-paths, RWB-E1-005,
    E1-010, E1-012; trackers are retired through the Cutover plan), source load reruns, the data quality exception list (RWB-E1-006; ACE ingestion
    checks) and the manual interface retirement sign-off. Re-keyed: CaseAccount.accountKey, CaseParty.personKey, Proceeds.paymentCode and the
    other links in Change Register v1 Appendix B. (C) Siam Commercial Bank and Henka Pte Ltd'
servers:
- url: /api/recovery/v1
  description: Relative to the ACE service in each environment
security:
- entraId: []
tags:
- name: Cases
- name: Work
- name: Decisions
- name: Treatment
- name: Litigation
- name: Assets
- name: Debt sale
- name: Write-off
- name: Money
- name: Documents
- name: Interactions
- name: Partners
- name: Partner portal
- name: Administration
- name: Rules and parameters
- name: Reporting
paths:
  /cases:
    get:
      tags:
      - Cases
      summary: List cases in the caller's scope with filters and paging
      operationId: getCases
      x-module: P3
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: product
        in: query
        required: false
        schema:
          type: string
      - name: stage
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: owner
        in: query
        required: false
        schema:
          type: string
      - name: queue
        in: query
        required: false
        schema:
          type: string
      - name: deviation
        in: query
        required: false
        schema:
          type: string
      - name: caseNo
        in: query
        required: false
        description: Exact case number (RW-YYYY-NNNNNN), max 18 characters; searches open and closed cases in the caller scope (RWB-E1-018).
        schema:
          type: string
          maxLength: 18
      - name: ageFrom
        in: query
        required: false
        schema:
          type: string
      - name: ageTo
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        schema:
          type: string
      description: Add query parameter route (LOV-ROUTE) and sort value serviceLevelDueAt; size 1 to 200; response header X-Data-As-Of. Case items
        add ageDays (integer), serviceLevelDueAt (date-time) and serviceLevelState (string). Add query parameter breached (boolean). Query values
        product, stage and status are checked against LOV-PRODUCT, LOV-STAGE and LOV-CASE-STATUS; a value outside its list returns 422 with MSG-GEN-007.
        Case items add prescriptionClockStatus (RUNNING, EXPIRED, NONE). Case items add nextAction (string), nextActionOwner (string), nextActionDueDate
        (date) and nextActionOverdue (boolean).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}:
    get:
      tags:
      - Cases
      summary: Read one case with accounts, parties, stage, owner, clocks and deviations
      operationId: getCasesCaseid
      x-module: P3
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: 'Schema Case: productGroup loses its closed enum (MORTGAGE, HIRE_PURCHASE, SSME, UNSECURED) and is validated against LOV-PRODUCT,
        so a product added to the list needs no API release. Applies wherever Case is returned (GET /cases, GET /cases/{caseId}, GET /queues/{queueId}/cases);
        a product filter value outside the list returns 422 with MSG-GEN-007.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/timeline:
    get:
      tags:
      - Cases
      summary: Read the case history as one timeline
      operationId: getCasesCaseidTimeline
      x-module: P3
      x-capability:
        area: Case record
        right: R
      x-first-release: E2
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      description: Add query parameters page (default 0) and size (default 50, 1 to 200). TimelinePage adds unavailableSources (array of string);
        TimelineItem adds reasonCode, fromQueueCode, toQueueCode and ruleId (string).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelinePage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/accounts:
    get:
      tags:
      - Cases
      summary: Read the accounts on the case with balances and arrears
      operationId: getCasesCaseidAccounts
      x-module: P3
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseAccount'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/parties:
    get:
      tags:
      - Cases
      summary: Read the parties on the case, masked by role
      operationId: getCasesCaseidParties
      x-module: P3
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseParty'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/transfer:
    post:
      tags:
      - Cases
      summary: Transfer the case to another owner or queue with a reason
      operationId: postCasesCaseidTransfer
      x-module: P3
      x-capability:
        area: Queue and allocation
        right: U
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: Declare the Idempotency-Key header (uuid, required). TransferRequest adds transferReasonCode (string, LOV-TRANSFER-REASON,
        required). A transfer rule refusal returns 409 with MSG-P3-033; a bulk transfer with refusals returns MSG-P3-035.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/deviations:
    post:
      tags:
      - Cases
      summary: Raise a deviation X1 to X7 on the case
      operationId: postCasesCaseidDeviations
      x-module: S8
      x-capability:
        area: Case record
        right: U
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviationRequest'
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deviation'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /deviations/{deviationId}:
    patch:
      tags:
      - Cases
      summary: Record the outcome of a deviation and return or re-route the case
      operationId: patchDeviationsDeviationid
      x-module: S8
      x-capability:
        area: Case record
        right: U
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviationOutcome'
      parameters:
      - name: deviationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deviation'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/legal-hold:
    post:
      tags:
      - Cases
      summary: Place or lift a legal hold on the case
      operationId: postCasesCaseidLegalHold
      x-module: P3
      x-capability:
        area: Case record
        right: U
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalHoldRequest'
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
  /me/tasks:
    get:
      tags:
      - Work
      summary: List the caller's open tasks
      operationId: getMeTasks
      x-module: P3
      x-capability:
        area: Case record
        right: R
      x-first-release: E2
      parameters:
      - name: due
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /tasks/{taskId}:
    patch:
      tags:
      - Work
      summary: Complete or reassign a task
      operationId: patchTasksTaskid
      x-module: P3
      x-capability:
        area: Case record
        right: U
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /queues:
    get:
      tags:
      - Work
      summary: List queues with counts, age and cap use
      operationId: getQueues
      x-module: P3
      x-capability:
        area: Queue and allocation
        right: R
      x-first-release: E2
      description: 'Queue adds openCaseCount (integer), oldestEntryDate (date), oldestAgeDays (integer), breachCount (integer) and owners (array
        of QueueOwnerLoad: ownerUserId uuid, openCaseCount integer, atCap boolean).'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Queue'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /queues/{queueId}/cases:
    get:
      tags:
      - Work
      summary: List the cases in a queue
      operationId: getQueuesQueueidCases
      x-module: P3
      x-capability:
        area: Queue and allocation
        right: R
      x-first-release: E2
      parameters:
      - name: queueId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /queues/{queueId}/placements:
    post:
      tags:
      - Work
      summary: Place a case on a queue from a model or an agent
      operationId: postQueuesQueueidPlacements
      x-module: P3
      x-capability:
        area: Queue and allocation
        right: C
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementRequest'
      parameters:
      - name: queueId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: 'Response becomes 201 PlacementResult (queueId, overflow, assignment absent when overflow is true, decisionLogEntryId) so a
        placement when every owner is at the cap returns the overflow result. PlacementRequest reason 1 to 1000 characters, version 1 to 40. Errors:
        404 MSG-P2-025 (placement switched off); 409 MSG-P2-024 (already in the queue), MSG-P2-021 (open deviation), MSG-P3-005, MSG-GEN-004;
        422 MSG-P2-020 (caller not approved), MSG-GEN-001, MSG-GEN-002.'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/timers:
    get:
      tags:
      - Work
      summary: 'Read the clocks on a case: stage, service level, prescription, notice'
      operationId: getCasesCaseidTimers
      x-module: P3
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Timer'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/recommendation:
    get:
      tags:
      - Decisions
      summary: Read the current recommendation with reasons and the expected return by route
      operationId: getCasesCaseidRecommendation
      x-module: P7
      x-capability:
        area: Decision log
        right: R
      x-first-release: E4
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: decision
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /approvals:
    get:
      tags:
      - Decisions
      summary: List decisions waiting for the caller's approval level
      operationId: getApprovals
      x-module: P7
      x-capability:
        area: Decision log
        right: A
      x-first-release: E2
      parameters:
      - name: decision
        in: query
        required: false
        schema:
          type: string
      - name: product
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      description: 'Authorization: Decision log A is held by no role. Check the A right in the capability area of each decision (see gaps); list
        only decisions the caller may approve.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /approvals/{approvalId}/approve:
    post:
      tags:
      - Decisions
      summary: Approve a decision within the caller's limit
      operationId: postApprovalsApprovalidApprove
      x-module: P7
      x-capability:
        area: Decision log
        right: A
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalAction'
      parameters:
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: 'Authorization as for GET /approvals, plus the level holder, substitute or route role. ApprovalAction adds reasonCode (LOV-OVERRIDE-REASON),
        changes (array of ApprovalTerm, for example templateCode) and membersPresent (array of uuid, committee levels L1 to L3). New 409 cases:
        MSG-P7-006 stale input, MSG-P6-003 template withdrawn.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionLogEntry'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /approvals/{approvalId}/return:
    post:
      tags:
      - Decisions
      summary: Return a decision to the preparer with a reason
      operationId: postApprovalsApprovalidReturn
      x-module: P7
      x-capability:
        area: Decision log
        right: A
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalAction'
      parameters:
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: Authorization as for GET /approvals; ApprovalAction changes as for approve.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /approvals/{approvalId}/refuse:
    post:
      tags:
      - Decisions
      summary: Refuse a decision with a reason
      operationId: postApprovalsApprovalidRefuse
      x-module: P7
      x-capability:
        area: Decision log
        right: A
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalAction'
      parameters:
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
          format: uuid

openapi: 3.1.0
info:
  title: "Recovery Workbench API - rwb-comms (Communications)"
  version: 5.0.0
  description: >-
    Operations of the Recovery Workbench API that belong to rwb-comms (Communications, module P6, service wave
    1) under Microservice Ownership Map v1, split from Recovery Workbench API Specification v4 (4.0.0, 16
    November 2026) by the D-RCV-60 microservice realignment.
    This document holds 11 operations under REST base /api/recovery/comms/v1; schema rwb_comms; topic
    rwb.comms.events.v1; Temporal task queue rwb-comms in namespace rwb-recovery. The v4 text of every
    operation, parameter, schema, response, number and date is kept unchanged.
    Moved into this document from another module of v4: none.
    Moved out of this document to another service: none.
    The v4 document description, the tag list and the document map are kept in index.yaml; the event contract of
    the service is in asyncapi/rwb-comms.asyncapi.yaml.
servers:
- url: "/api/recovery/comms/v1"
  description: "Relative to the rwb-comms service in each environment"
security:
- entraId: []
tags:
- name: "Treatment"
- name: "Litigation"
- name: "Interactions"
- name: "Administration"
x-service:
  code: "P6"
  service: "rwb-comms"
  name: "Communications"
  wave: 1
  schema: "rwb_comms"
  rest-base: "/api/recovery/comms/v1"
  topic: "rwb.comms.events.v1"
  task-queue: "rwb-comms"
  namespace: "rwb-recovery"
  asyncapi: "asyncapi/rwb-comms.asyncapi.yaml"
  operations: 11
paths:
  /cases/{caseId}/notices:
    post:
      tags:
      - Litigation
      summary: Generate a notice from the approved template
      operationId: postCasesCaseidNotices
      x-module: P6
      x-owner: "P6"
      x-capability:
        area: Litigation
        right: C
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeRequest'
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notice'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /notices/{noticeId}:
    get:
      tags:
      - Litigation
      summary: Read a notice with its dispatch and proof of delivery
      operationId: getNoticesNoticeid
      x-module: P6
      x-owner: "P6"
      x-capability:
        area: Litigation
        right: R
      x-first-release: E2
      parameters:
      - name: noticeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notice'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /admin/templates:
    get:
      tags:
      - Administration
      summary: List template versions by code, language and state
      operationId: getAdminTemplates
      x-module: P6
      x-owner: "P6"
      x-capability:
        area: Documents
        right: R
      x-first-release: E1
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: language
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
    post:
      tags:
      - Administration
      summary: Upload a new template version in state DRAFT
      operationId: postAdminTemplates
      x-module: P6
      x-owner: "P6"
      x-capability:
        area: Documents
        right: C
      x-first-release: E1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                templateCode:
                  type: string
                language:
                  type: string
                productGroup:
                  type: string
                channel:
                  type: string
                noticeType:
                  type: string
                signatureBasis:
                  type: string
                mergeCodes:
                  type: string
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '413':
          $ref: '#/components/responses/E413'
        '415':
          $ref: '#/components/responses/E415'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /admin/templates/{templateId}/content:
    get:
      tags:
      - Administration
      summary: Download a template body
      operationId: getAdminTemplatesTemplateidContent
      x-module: P6
      x-owner: "P6"
      x-capability:
        area: Documents
        right: R
      x-first-release: E1
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /admin/templates/{templateId}/approve:
    post:
      tags:
      - Administration
      summary: Record the Legal approval of a draft template version with its valid from date
      operationId: postAdminTemplatesTemplateidApprove
      x-module: P6
      x-owner: "P6"
      x-capability:
        area: Documents
        right: A
      x-first-release: E1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateApproval'
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /admin/templates/{templateId}/withdraw:
    post:
      tags:
      - Administration
      summary: Withdraw an approved template version with a reason
      operationId: postAdminTemplatesTemplateidWithdraw
      x-module: P6
      x-owner: "P6"
      x-capability:
        area: Documents
        right: A
      x-first-release: E1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateWithdrawal'
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/messages:
    post:
      tags:
      - Interactions
      summary: Send an SMS or LINE message from an approved template after the conduct check
      operationId: postCasesCaseidMessages
      x-module: P6
      x-owner: "P6"
      x-capability:
        area: Case record
        right: C
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /treatments/{treatmentId}/signature-requests:
    get:
      tags:
      - Treatment
      summary: List the signature requests of a treatment
      operationId: getTreatmentsTreatmentidSignatureRequests
      x-module: P6
      x-owner: "P6"
      x-capability:
        area: Treatment and offer
        right: R
      x-first-release: E2
      parameters:
      - name: treatmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SignatureRequest'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
    post:
      tags:
      - Treatment
      summary: Send reviewed generated documents for signature by e-signature, branch or paper; copies them to the write-once store and writes
        the decision log entry
      operationId: postTreatmentsTreatmentidSignatureRequests
      x-module: P6
      x-owner: "P6"
      x-capability:
        area: Treatment and offer
        right: C
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestCreate'
      parameters:
      - name: treatmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SignatureRequest'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /signature-requests/{requestId}/result:
    post:
      tags:
      - Treatment
      summary: Record a branch or paper signature result with the scanned document
      operationId: postSignatureRequestsRequestidResult
      x-module: P6
      x-owner: "P6"
      x-capability:
        area: Treatment and offer
        right: U
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureResultRequest'
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: 'Branch and paper signatures only. EasyApp e-signature results are not received by the Workbench: they land in ACE esign_request
        and are read through v_ace_esign (D-RCV-35). An e-signature request returns 409.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequest'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
components:
  securitySchemes:
    entraId:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration
  responses:
    E401:
      description: Unauthorized. No valid session, or the person holds no Workbench role. Messages MSG-P4-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Forbidden. The role lacks the right in the capability area. Messages MSG-P4-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found. The record does not exist or is outside the caller's scope. Messages MSG-P4-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflict. The state does not allow the action, the record changed, the approver is above the limit or prepared the decision.
        Messages MSG-P3-005, MSG-GEN-004, MSG-P7-001, MSG-P7-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E413:
      description: Payload too large. The file is above the size limit. Messages MSG-P5-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E415:
      description: Unsupported media type. The file type is not allowed. Messages MSG-P5-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: Unprocessable. A field fails validation. Messages MSG-GEN-001, MSG-GEN-002, MSG-GEN-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E503:
      description: Service unavailable. The decision could not be recorded, or a system of record is down. Messages MSG-P7-003, MSG-GEN-006
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Notice:
      type: object
      description: A demand, recall or statutory notice and its proof of delivery.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the notice
          readOnly: true
        caseId:
          type: string
          format: uuid
          description: The recovery_case this record belongs to
        documentId:
          type: string
          format: uuid
          description: The generated notice
        noticeType:
          type: string
          maxLength: 25
          enum:
          - DEMAND
          - RECALL
          - STATUTORY_SALE_NOTICE
          - GUARANTOR_NOTICE
          description: Demand, recall, statutory sale notice, guarantor notice
        sentDate:
          type: string
          format: date
          description: Date sent
        barcode:
          type: string
          maxLength: 40
          description: Registered mail barcode
        callbackDate:
          type: string
          format: date
          description: Date the proof of delivery came back
        deliveryStatus:
          type: string
          maxLength: 15
          enum:
          - DELIVERED
          - REFUSED
          - UNDELIVERABLE
          - PENDING
          description: Delivered, refused, undeliverable, pending
        sentType:
          type: string
          maxLength: 10
          enum:
          - BEFORE_NPL
          - NPL
          description: Before NPL or NPL
        personKey:
          type: string
          maxLength: 255
          description: ACE person_key of the customer the notice is addressed to
        templateId:
          type: string
          format: uuid
          description: Template version the notice was generated from
        holdReason:
          type: string
          maxLength: 30
          description: 'Why the notice is held: missing merge field, TEMPLATE_WITHDRAWN, CONTACT_STOP_Xn, LEGAL_HOLD'
        dispatchFileId:
          type: string
          format: uuid
          description: WIN file the notice was last written to
        dispatchAttempts:
          type: integer
          description: Number of WIN files the notice has been sent in without acknowledgment
      required:
      - id
      - caseId
      - noticeType
      - dispatchAttempts
    Interaction:
      type: object
      description: 'One entry in the interaction ledger: a contact, letter, promise, payment or hand-over.'
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the interaction
          readOnly: true
        caseId:
          type: string
          format: uuid
          description: The recovery_case this record belongs to
        personKey:
          type: string
          maxLength: 255
          description: ACE person_key of the customer (v_ace_customer)
        occurredAt:
          type: string
          format: date-time
          description: When it happened
        channel:
          type: string
          maxLength: 15
          enum:
          - MOBILE
          - HOME_PHONE
          - WORK_PHONE
          - LINE
          - EMAIL
          - POSTAL_ADDRESS
          - CALL
          - VISIT
          - SMS
          - LETTER
          - PORTAL
          - BRANCH
          description: Call, visit, SMS, LINE, email, letter, portal, branch; empty for Workbench events such as CASE_CREATED
        direction:
          type: string
          maxLength: 8
          enum:
          - INBOUND
          - OUTBOUND
          description: Inbound or outbound; empty for Workbench events such as CASE_CREATED
        actionCode:
          type: string
          maxLength: 10
          description: Action code
        contactResult:
          type: string
          maxLength: 20
          enum:
          - RIGHT_PARTY
          - THIRD_PARTY
          - NO_ANSWER
          - WRONG_NUMBER
          - REFUSED
          description: Right party, third party, no answer, wrong number
        promiseAmount:
          type: number
          description: Amount promised, baht
        promiseDate:
          type: string
          format: date
          description: Date promised
        summary:
          type: string
          maxLength: 2000
          x-personal-data: true
          description: Summary of what was said. Masked unless the caller's role may see it
        conductCheck:
          type: string
          maxLength: 15
          enum:
          - PASSED
          - BLOCKED
          - NOT_APPLICABLE
          description: Passed, blocked, not applicable
        sourceSystem:
          type: string
          maxLength: 10
          enum:
          - EFS
          - WORKBENCH
          description: EFS for collections history read from ACE (v_ace_efs_action), or the Workbench
        eventCode:
          type: string
          maxLength: 40
          enum:
          - CONTACT
          - LETTER
          - PROMISE
          - PAYMENT
          - HANDOVER
          - CASE_CREATED
          - CASE_ALLOCATED
          - CASE_TRANSFERRED
          - CASE_ESCALATED
          - DOCUMENT_ATTACHED
          - DECISION_TAKEN
          - CORRECTION
          - PARTNER_RESULT
          - OFFER
          description: Ledger event
        actorType:
          type: string
          maxLength: 10
          enum:
          - USER
          - SERVICE
          - PARTNER
          description: User, service or partner
        actorRef:
          type: string
          maxLength: 64
          description: User ID or service identity code that acted
        sourceRef:
          type: string
          maxLength: 60
          description: Producing module and event, or the interface, for example EV-02 CaseAllocated or INT-07
        idempotencyKey:
          type: string
          maxLength: 120
          description: Unique key of the event or request; repeats are rejected; unique on its own
        caseSeq:
          type: string
          description: Gap-free sequence of the entry within its case; unique with case_id
        decisionLogId:
          type: string
          format: uuid
          description: Decision log entry the entry records, for DECISION_TAKEN
        correctsEntryId:
          type: string
          format: uuid
          description: Entry this entry corrects
        contactKey:
          type: string
          maxLength: 255
          description: The contact point reached, as the v_ace_contact composite key contact_type:key (PHONE, EMAIL or ADDRESS); the number or
            address is masked by role
        fromHolderRef:
          type: string
          maxLength: 60
          description: 'Who held the case before a hand-over: USER:<user id> or PARTNER:<partner code>'
        toHolderRef:
          type: string
          maxLength: 60
          description: 'Who holds the case after a hand-over: USER:<user id> or PARTNER:<partner code>'
        treatmentId:
          type: string
          format: uuid
          description: The treatment offered, for an OFFER entry
        proceedsId:
          type: string
          format: uuid
          description: The proceeds matched, for a PAYMENT entry
        retentionClass:
          type: string
          maxLength: 10
          description: Retention class of the entry, set by entry type
        deliveryStatus:
          type: string
          maxLength: 15
          enum:
          - SENT
          - DELIVERED
          - READ
          - FAILED
          description: Delivery state of an outbound SMS, LINE message or letter
        externalRef:
          type: string
          maxLength: 60
          description: Reference returned by NSS, LINE OA or WIN
      required:
      - id
      - caseId
      - occurredAt
      - sourceSystem
    NoticeRequest:
      type: object
      properties:
        noticeType:
          type: string
          enum:
          - DEMAND
          - RECALL
          - STATUTORY_SALE_NOTICE
          - GUARANTOR_NOTICE
        personKey:
          type: string
          maxLength: 255
        language:
          type: string
          enum:
          - TH
          - EN
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        messageCode:
          type: string
        messageTh:
          type: string
        field:
          type: string
        traceId:
          type: string
    SignatureRequestCreate:
      type: object
      properties:
        documentIds:
          type: array
          items:
            type: string
            format: uuid
        personKey:
          type: string
          maxLength: 255
        method:
          type: string
    SignatureRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        treatmentId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        personKey:
          type: string
          maxLength: 255
        method:
          type: string
        status:
          type: string
          description: Signature status; for e-signature it follows v_ace_esign.status, for branch or paper it is recorded through POST /signature-requests/{requestId}/result
        externalRef:
          type: string
          description: EasyApp reference, read from v_ace_esign (EasyApp lands in ACE esign_request); read only
          readOnly: true
        sentAt:
          type: string
          format: date-time
        signedAt:
          type: string
          format: date-time
        signedDocumentId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    SignatureResultRequest:
      type: object
      properties:
        result:
          type: string
        signedDocumentId:
          type: string
          format: uuid
        signedAt:
          type: string
          format: date-time
    TemplatePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Template'
        page:
          type: integer
        size:
          type: integer
        total:

openapi: 3.1.0
info:
  title: "Recovery Workbench API - rwb-partner (Partner)"
  version: 5.0.0
  description: >-
    Operations of the Recovery Workbench API that belong to rwb-partner (Partner, module S9, service wave 4)
    under Microservice Ownership Map v1, split from Recovery Workbench API Specification v4 (4.0.0, 16 November
    2026) by the D-RCV-60 microservice realignment.
    This document holds 6 operations under REST base /api/recovery/partner/v1; schema rwb_partner; topic
    rwb.partner.events.v1; Temporal task queue rwb-partner in namespace rwb-recovery. The v4 text of every
    operation, parameter, schema, response, number and date is kept unchanged.
    Moved into this document from another module of v4: none.
    Moved out of this document to another service: none.
    The v4 document description, the tag list and the document map are kept in index.yaml; the event contract of
    the service is in asyncapi/rwb-partner.asyncapi.yaml.
servers:
- url: "/api/recovery/partner/v1"
  description: "Relative to the rwb-partner service in each environment"
security:
- entraId: []
tags:
- name: "Partners"
- name: "Partner portal"
x-service:
  code: "S9"
  service: "rwb-partner"
  name: "Partner"
  wave: 4
  schema: "rwb_partner"
  rest-base: "/api/recovery/partner/v1"
  topic: "rwb.partner.events.v1"
  task-queue: "rwb-partner"
  namespace: "rwb-recovery"
  asyncapi: "asyncapi/rwb-partner.asyncapi.yaml"
  operations: 6
paths:
  /partners:
    get:
      tags:
      - Partners
      summary: List partners with panel status and score
      operationId: getPartners
      x-module: S9
      x-owner: "S9"
      x-capability:
        area: Partner portal
        right: R
      x-first-release: E2
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Partner'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/instructions:
    post:
      tags:
      - Partners
      summary: Issue an instruction to a partner by rule
      operationId: postCasesCaseidInstructions
      x-module: S9
      x-owner: "S9"
      x-capability:
        area: Partner portal
        right: C
      x-first-release: E4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructionRequest'
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerInstruction'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /partner/instructions:
    get:
      tags:
      - Partner portal
      summary: List the instructions placed with the caller's firm
      operationId: getPartnerInstructions
      x-module: S9
      x-owner: "S9"
      x-capability:
        area: Partner portal
        right: R
      x-first-release: E4
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionPage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /partner/instructions/{instructionId}/accept:
    post:
      tags:
      - Partner portal
      summary: Accept or decline an instruction
      operationId: postPartnerInstructionsInstructionidAccept
      x-module: S9
      x-owner: "S9"
      x-capability:
        area: Partner portal
        right: U
      x-first-release: E4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructionAcceptance'
      parameters:
      - name: instructionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerInstruction'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
  /partner/instructions/{instructionId}/results:
    post:
      tags:
      - Partner portal
      summary: Record a result with its documents
      operationId: postPartnerInstructionsInstructionidResults
      x-module: S9
      x-owner: "S9"
      x-capability:
        area: Partner portal
        right: U
      x-first-release: E4
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                result:
                  type: string
                files:
                  type: string
                  format: binary
      parameters:
      - name: instructionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerInstruction'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '415':
          $ref: '#/components/responses/E415'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /partner/instructions/{instructionId}/invoices:
    post:
      tags:
      - Partner portal
      summary: Submit a fee invoice
      operationId: postPartnerInstructionsInstructionidInvoices
      x-module: S9
      x-owner: "S9"
      x-capability:
        area: Partner portal
        right: C
      x-first-release: E6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
      parameters:
      - name: instructionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
components:
  securitySchemes:
    entraId:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration
  responses:
    E401:
      description: Unauthorized. No valid session, or the person holds no Workbench role. Messages MSG-P4-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Forbidden. The role lacks the right in the capability area. Messages MSG-P4-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found. The record does not exist or is outside the caller's scope. Messages MSG-P4-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflict. The state does not allow the action, the record changed, the approver is above the limit or prepared the decision.
        Messages MSG-P3-005, MSG-GEN-004, MSG-P7-001, MSG-P7-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E415:
      description: Unsupported media type. The file type is not allowed. Messages MSG-P5-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: Unprocessable. A field fails validation. Messages MSG-GEN-001, MSG-GEN-002, MSG-GEN-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E503:
      description: Service unavailable. The decision could not be recorded, or a system of record is down. Messages MSG-P7-003, MSG-GEN-006
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Partner:
      type: object
      description: An outside firm the bank places work with.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the partner
          readOnly: true
        partnerCode:
          type: string
          maxLength: 20
          description: Partner code
        partnerName:
          type: string
          maxLength: 160
          description: Registered name
        partnerType:
          type: string
          maxLength: 15
          enum:
          - AGENCY
          - LAW_FIRM
          - VALUER
          - AUCTION_VENDOR
          - BROKER
          - DEBT_BUYER
          - AMC
          - RAMC
          description: Agency, law firm, valuer, auction vendor, broker, debt buyer, AMC, RAMC
        panelStatus:
          type: string
          maxLength: 12
          enum:
          - ACTIVE
          - ON_NOTICE
          - SUSPENDED
          - EXITED
          description: Active, on notice, suspended, exited
        contractEnd:
          type: string
          format: date
          description: Contract end date
        score:
          type: number
          description: Latest scorecard result
      required:
      - id
      - partnerCode
      - partnerName
      - partnerType
      - panelStatus
    PartnerInstruction:
      type: object
      description: Work placed with a partner on a case.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the partner instruction
          readOnly: true
        caseId:
          type: string
          format: uuid
          description: The recovery_case this record belongs to
        partnerId:
          type: string
          format: uuid
          description: The partner this record belongs to
        instructionType:
          type: string
          maxLength: 20
          enum:
          - COLLECT
          - FILE_SUIT
          - ENFORCE
          - APPRAISE
          - REPOSSESS
          - LIST
          - SELL
          description: Collect, file suit, enforce, appraise, repossess, list, sell
        instructedAt:
          type: string
          format: date-time
          description: When instructed
        dueAt:
          type: string
          format: date-time
          description: When the result is due
        status:
          type: string
          maxLength: 12
          enum:
          - SENT
          - ACCEPTED
          - DECLINED
          - IN_PROGRESS
          - DONE
          - RECALLED
          description: Sent, accepted, declined, in progress, done, recalled
        resultCode:
          type: string
          maxLength: 40
          description: Result reported by the partner
        feeAmount:
          type: number
          description: Fee payable, baht
      required:
      - id
      - caseId
      - partnerId
      - instructionType
      - instructedAt
      - status
    InstructionRequest:
      type: object
      properties:
        instructionType:
          type: string
          enum:
          - COLLECT
          - FILE_SUIT
          - ENFORCE
          - APPRAISE
          - REPOSSESS
          - LIST
          - SELL
        partnerId:
          type: string
          format: uuid
        dueOn:
          type: string
          format: date
    InstructionAcceptance:
      type: object
      properties:
        accepted:
          type: boolean
        reason:
          type: string
    InvoiceRequest:
      type: object
      properties:
        instructionIds:
          type: array
          items:
            type: string
            format: uuid
        amount:
          type: number
        invoiceNo:
          type: string
    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
        status:
          type: string
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        messageCode:
          type: string
        messageTh:
          type: string
        field:
          type: string
        traceId:
          type: string
    InstructionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartnerInstruction'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer

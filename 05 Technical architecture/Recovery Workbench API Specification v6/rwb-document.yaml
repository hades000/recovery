openapi: 3.1.0
info:
  title: "Recovery Workbench API - rwb-document (Document)"
  version: 5.0.0
  description: >-
    Operations of the Recovery Workbench API that belong to rwb-document (Document, module P5, service wave 1)
    under Microservice Ownership Map v1, split from Recovery Workbench API Specification v4 (4.0.0, 16 November
    2026) by the D-RCV-60 microservice realignment.
    This document holds 17 operations under REST base /api/recovery/document/v1; schema rwb_document; topic
    rwb.document.events.v1; Temporal task queue rwb-document in namespace rwb-recovery. The v4 text of every
    operation, parameter, schema, response, number and date is kept unchanged.
    Moved into this document from another module of v4: none.
    Moved out of this document to another service: none.
    The v4 document description, the tag list and the document map are kept in index.yaml; the event contract of
    the service is in asyncapi/rwb-document.asyncapi.yaml.
servers:
- url: "/api/recovery/document/v1"
  description: "Relative to the rwb-document service in each environment"
security:
- entraId: []
tags:
- name: "Documents"
x-service:
  code: "P5"
  service: "rwb-document"
  name: "Document"
  wave: 1
  schema: "rwb_document"
  rest-base: "/api/recovery/document/v1"
  topic: "rwb.document.events.v1"
  task-queue: "rwb-document"
  namespace: "rwb-recovery"
  asyncapi: "asyncapi/rwb-document.asyncapi.yaml"
  operations: 17
paths:
  /cases/{caseId}/documents:
    get:
      tags:
      - Documents
      summary: List the documents on a case
      operationId: getCasesCaseidDocuments
      x-module: P5
      x-owner: "P5"
      x-capability:
        area: Documents
        right: R
      x-first-release: E1
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      description: Add query parameters dateFrom and dateTo (date) on the stored date; 422 with MSG-GEN-003 when dateFrom is after dateTo.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
    post:
      tags:
      - Documents
      summary: Upload a document to the case
      operationId: postCasesCaseidDocuments
      x-module: P5
      x-owner: "P5"
      x-capability:
        area: Documents
        right: C
      x-first-release: E1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                type:
                  type: string
                source:
                  type: string
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: Same file and type already on the case returns 200 with the existing Document and messageCode MSG-P5-024. 413 uses MSG-P5-017;
        422 uses MSG-P5-016 (malware found) and MSG-P5-006 (type not in force); 503 with MSG-P5-022 when the malware scan does not answer. Document
        adds messageCode (string).
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '413':
          $ref: '#/components/responses/E413'
        '415':
          $ref: '#/components/responses/E415'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /documents/{documentId}:
    get:
      tags:
      - Documents
      summary: Read a document's metadata, versions and extracted fields
      operationId: getDocumentsDocumentid
      x-module: P5
      x-owner: "P5"
      x-capability:
        area: Documents
        right: R
      x-first-release: E1
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: 'Document adds storedAt (date-time), previousVersionId (uuid) and versions (array of DocumentVersion: id uuid, docVersion integer,
        storedAt date-time, source string, isActive boolean).'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /documents/{documentId}/content:
    get:
      tags:
      - Documents
      summary: Download the document content
      operationId: getDocumentsDocumentidContent
      x-module: P5
      x-owner: "P5"
      x-capability:
        area: Documents
        right: R
      x-first-release: E1
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /documents/{documentId}/versions:
    post:
      tags:
      - Documents
      summary: Add a new version of a document
      operationId: postDocumentsDocumentidVersions
      x-module: P5
      x-owner: "P5"
      x-capability:
        area: Documents
        right: U
      x-first-release: E1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                reason:
                  type: string
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: Add 413 with MSG-P5-017 for a file above INTAKE_MAX_FILE_MB, and 409 with MSG-P5-025 when the document is not the latest version.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '415':
          $ref: '#/components/responses/E415'
        '503':
          $ref: '#/components/responses/E503'
  /documents/{documentId}/fields/{fieldId}:
    patch:
      tags:
      - Documents
      summary: Confirm or correct an extracted field
      operationId: patchDocumentsDocumentidFieldsFieldid
      x-module: P5
      x-owner: "P5"
      x-capability:
        area: Documents
        right: U
      x-first-release: E1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldReview'
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: fieldId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentField'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /documents/{documentId}/custody:
    post:
      tags:
      - Documents
      summary: Record an original document going out or coming back
      operationId: postDocumentsDocumentidCustody
      x-module: P5
      x-owner: "P5"
      x-capability:
        area: Documents
        right: U
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustodyRequest'
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCustody'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/document-checklist:
    get:
      tags:
      - Documents
      summary: Read the required document types for the case with present counts
      operationId: getCasesCaseidDocumentChecklist
      x-module: P5
      x-owner: "P5"
      x-capability:
        area: Documents
        right: R
      x-first-release: E1
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentChecklist'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /documents:
    get:
      tags:
      - Documents
      summary: Search active documents across the cases in the caller's scope by type, stored date, extracted field and free text; each search
        written to the access log
      operationId: getDocuments
      x-module: P5
      x-owner: "P5"
      x-capability:
        area: Documents
        right: R
      x-first-release: E1
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: dateFrom
        in: query
        required: false
        schema:
          type: string
      - name: dateTo
        in: query
        required: false
        schema:
          type: string
      - name: field
        in: query
        required: false
        schema:
          type: string
      - name: op
        in: query
        required: false
        schema:
          type: string
      - name: value
        in: query
        required: false
        schema:
          type: string
      - name: value2
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:

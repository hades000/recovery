        '503':
          $ref: '#/components/responses/E503'
  /intake-items/{intakeItemId}:
    get:
      tags:
      - Documents
      summary: Read one held intake item with its OCR text, candidates and extracted fields, masked by role; each read written to the access log
      operationId: getIntakeItemsIntakeitemid
      x-module: P5
      x-owner: "P5"
      x-capability:
        area: Documents
        right: R
      x-first-release: E1
      parameters:
      - name: intakeItemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeItem'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /intake-items/{intakeItemId}/content:
    get:
      tags:
      - Documents
      summary: Download the file of a held intake item for the reviewer
      operationId: getIntakeItemsIntakeitemidContent
      x-module: P5
      x-owner: "P5"
      x-capability:
        area: Documents
        right: R
      x-first-release: E1
      parameters:
      - name: intakeItemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /intake-items/{intakeItemId}/resolve:
    post:
      tags:
      - Documents
      summary: 'Resolve a held intake item: set its type, attach it to a case in scope with confirmed fields, or discard it with a reason'
      operationId: postIntakeItemsIntakeitemidResolve
      x-module: P5
      x-owner: "P5"
      x-capability:
        area: Documents
        right: U
      x-first-release: E1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeResolveRequest'
      parameters:
      - name: intakeItemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeResolution'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /documents/{documentId}/review:
    post:
      tags:
      - Documents
      summary: Complete the review of a stored document or a generated draft whose fields were in review
      operationId: postDocumentsDocumentidReview
      x-module: P5
      x-owner: "P5"
      x-capability:

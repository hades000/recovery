        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
components:
  securitySchemes:
    entraId:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration
  responses:
    E401:
      description: Unauthorized. No valid session, or the person holds no Workbench role. Messages MSG-P4-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Forbidden. The role lacks the right in the capability area. Messages MSG-P4-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found. The record does not exist or is outside the caller's scope. Messages MSG-P4-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflict. The state does not allow the action, the record changed, the approver is above the limit or prepared the decision.
        Messages MSG-P3-005, MSG-GEN-004, MSG-P7-001, MSG-P7-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E413:
      description: Payload too large. The file is above the size limit. Messages MSG-P5-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E415:
      description: Unsupported media type. The file type is not allowed. Messages MSG-P5-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: Unprocessable. A field fails validation. Messages MSG-GEN-001, MSG-GEN-002, MSG-GEN-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E503:
      description: Service unavailable. The decision could not be recorded, or a system of record is down. Messages MSG-P7-003, MSG-GEN-006
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Document:
      type: object
      description: A document held against a case.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the document
          readOnly: true
        caseId:
          type: string
          format: uuid
          description: The recovery_case this record belongs to
        personKey:
          type: string
          maxLength: 255
          description: ACE person_key of the customer the document belongs to
        documentType:
          type: string
          maxLength: 30
          description: Type from the document checklist
        source:
          type: string
          maxLength: 12
          enum:
          - SCAN
          - UPLOAD
          - GENERATED
          - PARTNER
          - EMAIL
          description: Scan, upload, generated, partner, email
        storageRef:
          type: string
          maxLength: 400
          description: Reference to the stored file
        classificationConfidence:
          type: number
          description: OCR classification confidence
        reviewStatus:
          type: string
          maxLength: 12
          enum:
          - NOT_NEEDED
          - PENDING
          - CONFIRMED
          - CORRECTED
          description: Not needed, pending, confirmed, corrected
        retentionClass:
          type: string
          maxLength: 10
          description: Retention class
        writeOnce:
          type: boolean
          description: True for legal documents held write-once
        docVersion:
          type: integer
          description: Document version
        previousVersionId:
          type: string
          format: uuid
          description: The document row this version supersedes; empty for version 1
        contentSha256:
          type: string
          maxLength: 64
          description: SHA-256 of the stored file, for the duplicate check and the integrity check
        capturedAt:
          type: string
          format: date-time
          description: Device time when the field app captured the file
        captureLatitude:
          type: number
          x-personal-data: true
          description: GPS latitude at capture. Masked unless the caller's role may see it
        captureLongitude:
          type: number
          x-personal-data: true
          description: GPS longitude at capture. Masked unless the caller's role may see it
        clientFileId:
          type: string
          maxLength: 64
          description: Field app file ID, unique per case, for repeat syncs
        captureKind:
          type: string
          maxLength: 12
          enum:
          - PHOTO
          - BILL
          - CHECKLIST
          description: Photo, bill or checklist
        templateId:
          type: string
          format: uuid
          description: Template version a generated document was made from
        treatmentId:
          type: string
          format: uuid
          description: Treatment a generated document belongs to
      required:
      - id
      - caseId
      - documentType
      - source
      - storageRef
      - reviewStatus
      - retentionClass
      - writeOnce
      - docVersion
      - contentSha256
    DocumentField:
      type: object
      description: A field read from a document.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the document field
          readOnly: true
        documentId:
          type: string
          format: uuid
          description: The document this record belongs to
        fieldName:
          type: string
          maxLength: 60
          description: Field name from the document type
        fieldValue:
          type: string
          maxLength: 1000
          x-personal-data: true
          description: Value read, masked where personal. Masked unless the caller's role may see it
        confidence:
          type: number
          description: Extraction confidence
        confirmedBy:
          type: string
          format: uuid
          description: Who confirmed a low confidence value
        extractedValue:
          type: string
          maxLength: 1000
          x-personal-data: true
          description: The value as first read by the extractor, kept when a person corrects field_value; masked by role. Masked unless the caller's
            role may see it
        extractorVersion:
          type: string
          maxLength: 40
          description: Extraction approach and model version that produced the value
      required:
      - id
      - documentId
      - fieldName
    DocumentCustody:
      type: object
      description: Each movement of an original document.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the custody movement
          readOnly: true
        documentId:
          type: string
          format: uuid
          description: The document this record belongs to
        movedAt:
          type: string
          format: date-time
          description: When it moved
        fromLocation:
          type: string
          maxLength: 20
          enum:
          - VAULT
          - BRANCH
          - POST
          - LAWYER
          - COURT
          - LAND_OFFICE
          description: Vault, branch, post, lawyer, court, land office
        toLocation:
          type: string
          maxLength: 20
          enum:
          - VAULT
          - BRANCH
          - POST
          - LAWYER
          - COURT
          - LAND_OFFICE
          description: Where it went
        heldBy:
          type: string
          maxLength: 120
          description: Person or firm holding it
        dueBack:
          type: string
          format: date
          description: When it is due back
      required:
      - id
      - documentId
      - movedAt
      - fromLocation
      - toLocation
      - heldBy

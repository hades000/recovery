        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /review-items:
    get:
      tags:
      - Documents
      summary: 'List the document review queue: held intake items and documents with fields in review, in the caller''s scope, oldest first'
      operationId: getReviewItems
      x-module: P5
      x-owner: "P5"
      x-capability:
        area: Documents
        right: R
      x-first-release: E1
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItemPage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '422':

  /documents/{documentId}/regenerate:
    post:
      tags:
      - Documents
      summary: Correct overridable merge values of a generated draft with a reason and generate the next version
      operationId: postDocumentsDocumentidRegenerate
      x-module: P5
      x-owner: "P5"
      x-capability:
        area: Documents
        right: U
      x-first-release: E2
      requestBody:
        required: true

openapi: 3.1.0
info:
  title: "Recovery Workbench API - index"
  version: 5.0.0
  description: >-
    Index and document map of Recovery Workbench API version 5.0.0, 22 November 2026, D-RCV-60 microservice
    realignment. The v4 document (one OpenAPI file for the whole module) is split into one document per service
    (19), the gateway-bff document and this index: every operation sits in exactly one document, and every
    document carries the same operation, schema, response, parameter, number and date text as v4.
    Owner of every operation is the owner of Microservice Ownership Map v1 (sheet Endpoints); where that owner
    differs from the v4 x-module, the operation carries x-owner and x-owner-note and the move is listed under
    x-owner-changes. REST base of each service is /api/recovery/<short>/v1, topic rwb.<short>.events.v1, task
    queue rwb-<short> in namespace rwb-recovery (Template and Rules R4; Arch v5 slide 41).
    Each served topic has an AsyncAPI 3.0 document under asyncapi/, one per service plus one shared document for
    rwb.decision-record.v1 (Arch v5 slide 42 notes: the AsyncAPI document per service is the contract).
    Version 4.0.0 description follows unchanged.
    Endpoints of the recovery module in the ACE service. Every endpoint checks the role, the capability area,
    the right and the scope. Version 4.0.0, 16 November 2026: rule packages in embedded Drools replace rule
    versions (D-RCV-36, T3 to T5); the three former rule-version paths become the seven rule-package paths and
    POST /admin/workflows/smoke is added. Version 3.0.0, 15 November 2026: re-based on the ACE database under
    D-RCV-35 (U1 to U5). The Workbench takes no inbound source data; source records are read only through the
    SELECT-only recovery.v_ace_* views and linked by ACE business keys (account_key, person_key, payment_code,
    contact_key, asset_key, valuation_key) with no foreign key into ACE. Removed: the tracker endpoints
    (/admin/trackers and its sub-paths, RWB-E1-005, E1-010, E1-012; trackers are retired through the Cutover
    plan), source load reruns, the data quality exception list (RWB-E1-006; ACE ingestion checks) and the manual
    interface retirement sign-off. Re-keyed: CaseAccount.accountKey, CaseParty.personKey, Proceeds.paymentCode
    and the other links in Change Register v1 Appendix B. (C) Siam Commercial Bank and Henka Pte Ltd
servers:
- url: "/api/recovery"
  description: "Shared App Gateway route to the Recovery gateway-bff (Arch v5 slide 34); each service document carries its own base /api/recovery/<short>/v1"

          type: integer
        noMatch:
          type: integer
        refused:
          type: integer
        samples:
          type: array
          items:
            type: object
            properties:
              caseNo:
                type: string
              ruleId:
                type: string
              outputs:
                type: object
                additionalProperties: true
      required:
      - versionId
      - packageCode
      - versionLabel
      - casesEvaluated
    RuleChangeReport:
      type: object
      description: Rule package changes, their checklists and the decisions taken under each version (RWB-E2-041).
      properties:
        generatedAt:
          type: string
          format: date-time
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        packages:
          type: array
          items:
            type: object
            properties:
              packageCode:
                type: string
              versionLabel:
                type: string
              status:
                type: string
              author:
                type: string
                format: uuid
              approver:
                type: string
                format: uuid
              loadedAt:
                type: string
                format: date-time
              approvedAt:
                type: string
                format: date-time
              validFrom:
                type: string
                format: date
              checksum:
                type: string
              checklistComplete:
                type: boolean
              decisionCount:
                type: integer
      required:
      - generatedAt
      - packages

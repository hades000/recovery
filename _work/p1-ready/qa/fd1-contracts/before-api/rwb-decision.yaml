    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: URI of the error-map row
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: Request path and trace ID, stamped by the owning service
        messageCode:
          type: string
          pattern: '^MSG-[A-Z0-9]+(-[A-Z0-9]+)*-\d{3}$'
        messageTh:
          type: string
          description: Thai text of the message code
        field:
          type: string
          description: JSON Pointer or parameter or header name of the first failing input
        errors:
          type: array
          description: Present only on 400 or 422 when more than one input fails
          items:
            type: object
            properties:
              field:

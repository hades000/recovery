openapi: 3.1.0
info:
  title: "Recovery Workbench API - rwb-case (Case and workflow)"
  version: 5.1.0
  description: >-
    Operations of the Recovery Workbench API that belong to rwb-case (Case and workflow, module P3, service wave
    1) under Microservice Ownership Map v1, split from Recovery Workbench API Specification v4 (4.0.0, 16
    November 2026) by the D-RCV-60 microservice realignment.
    This document holds 24 operations under REST base /api/recovery/case/v1; schema rwb_case; topic
    rwb.case.events.v1; Temporal task queue rwb-case in namespace rwb-recovery. The v4 text of every operation,
    parameter, schema, response, number and date is kept unchanged.
    Moved into this document from another module of v4: GET /admin/lists/{listCode} (x-module P4, owner P3);
    POST /admin/reference-loads (x-module P4, owner P3); POST /admin/reference-loads/{loadId}/approve (x-module
    P4, owner P3); POST /admin/reference-loads/{loadId}/verify (x-module P4, owner P3); POST
    /admin/reference-loads/{loadId}/rollback (x-module P4, owner P3).
    Moved out of this document to another service: GET /cases/{caseId}/interactions (now rwb-source-data, owner
    P1); POST /cases/{caseId}/interactions (now rwb-source-data, owner P1); GET /admin/rule-packages (now
    rwb-decision, owner P7); POST /admin/rule-packages/{packageCode}/versions (now rwb-decision, owner P7); GET
    /admin/rule-packages/{packageCode}/versions (now rwb-decision, owner P7); POST
    /admin/rule-package-versions/{versionId}/approve (now rwb-decision, owner P7); POST
    /admin/rule-package-versions/{versionId}/rollback (now rwb-decision, owner P7); GET
    /admin/rule-package-versions/{versionId}/dry-run (now rwb-decision, owner P7); GET
    /admin/rule-packages/change-report (now rwb-decision, owner P7); POST /admin/workflows/smoke (now
    gateway-bff (PLT platform surface), owner PLT).
    The v4 document description, the tag list and the document map are kept in index.yaml; the event contract of
    the service is in asyncapi/rwb-case.asyncapi.yaml.
servers:
- url: "/api/recovery/case/v1"
  description: "Relative to the rwb-case service in each environment"
security:
- entraId: []
tags:
- name: "Cases"
- name: "Work"
- name: "Administration"
x-service:
  code: "P3"
  service: "rwb-case"
  name: "Case and workflow"
  wave: 1
  schema: "rwb_case"
  rest-base: "/api/recovery/case/v1"
  topic: "rwb.case.events.v1"
  task-queue: "rwb-case"
  namespace: "rwb-recovery"
  asyncapi: "asyncapi/rwb-case.asyncapi.yaml"
  operations: 24
paths:
  /cases:
    get:
      tags:
      - Cases
      summary: List cases in the caller's scope with filters and paging
      operationId: getCases
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: product
        in: query
        required: false
        schema:
          type: string
      - name: stage
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: owner
        in: query
        required: false
        schema:
          type: string
      - name: queue
        in: query
        required: false
        schema:
          type: string
      - name: deviation
        in: query
        required: false
        schema:
          type: string
      - name: caseNo
        in: query
        required: false
        description: Exact case number (RW-YYYY-NNNNNN), max 18 characters; searches open and closed cases in the caller scope (RWB-E1-018).
        schema:
          type: string
          maxLength: 18
      - name: ageFrom
        in: query
        required: false
        schema:
          type: string
      - name: ageTo
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        schema:
          type: string
      description: Add query parameter route (LOV-ROUTE) and sort value serviceLevelDueAt; size 1 to 200; response header X-Data-As-Of. Case items
        add ageDays (integer), serviceLevelDueAt (date-time) and serviceLevelState (string). Add query parameter breached (boolean). Query values
        product, stage and status are checked against LOV-PRODUCT, LOV-STAGE and LOV-CASE-STATUS; a value outside its list returns 422 with MSG-GEN-007.
        Case items add prescriptionClockStatus (RUNNING, EXPIRED, NONE). Case items add nextAction (string), nextActionOwner (string), nextActionDueDate
        (date) and nextActionOverdue (boolean).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}:
    get:
      tags:
      - Cases
      summary: Read one case with accounts, parties, stage, owner, clocks and deviations
      operationId: getCasesCaseid
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: 'Schema Case: productGroup loses its closed enum (MORTGAGE, HIRE_PURCHASE, SSME, UNSECURED) and is validated against LOV-PRODUCT,
        so a product added to the list needs no API release. Applies wherever Case is returned (GET /cases, GET /cases/{caseId}, GET /queues/{queueId}/cases);
        a product filter value outside the list returns 422 with MSG-GEN-007.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/timeline:
    get:
      tags:
      - Cases
      summary: Read the case history as one timeline
      operationId: getCasesCaseidTimeline
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Case record
        right: R
      x-first-release: E2
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      description: Add query parameters page (default 0) and size (default 50, 1 to 200). TimelinePage adds unavailableSources (array of string);
        TimelineItem adds reasonCode, fromQueueCode, toQueueCode and ruleId (string).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelinePage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/accounts:
    get:
      tags:
      - Cases
      summary: Read the accounts on the case with balances and arrears
      operationId: getCasesCaseidAccounts
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseAccount'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/parties:
    get:
      tags:
      - Cases
      summary: Read the parties on the case, masked by role
      operationId: getCasesCaseidParties
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseParty'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/transfer:
    post:
      tags:
      - Cases
      summary: Transfer the case to another owner or queue with a reason
      operationId: postCasesCaseidTransfer
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Queue and allocation
        right: U
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: Declare the Idempotency-Key header (uuid, required). TransferRequest adds transferReasonCode (string, LOV-TRANSFER-REASON,
        required). A transfer rule refusal returns 409 with MSG-P3-033; a bulk transfer with refusals returns MSG-P3-035.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/legal-hold:
    post:
      tags:
      - Cases
      summary: Place or lift a legal hold on the case
      operationId: postCasesCaseidLegalHold
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Case record
        right: U
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalHoldRequest'
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
  /me/tasks:
    get:
      tags:
      - Work
      summary: List the caller's open tasks
      operationId: getMeTasks
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Case record
        right: R
      x-first-release: E2
      parameters:
      - name: due
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /tasks/{taskId}:
    patch:
      tags:
      - Work
      summary: Complete or reassign a task
      operationId: patchTasksTaskid
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Case record
        right: U
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /queues:
    get:
      tags:
      - Work
      summary: List queues with counts, age and cap use
      operationId: getQueues
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Queue and allocation
        right: R
      x-first-release: E2
      description: 'Queue adds openCaseCount (integer), oldestEntryDate (date), oldestAgeDays (integer), breachCount (integer) and owners (array
        of QueueOwnerLoad: ownerUserId uuid, openCaseCount integer, atCap boolean).'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Queue'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /queues/{queueId}/cases:
    get:
      tags:
      - Work
      summary: List the cases in a queue
      operationId: getQueuesQueueidCases
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Queue and allocation
        right: R
      x-first-release: E2
      parameters:
      - name: queueId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /queues/{queueId}/placements:
    post:
      tags:
      - Work
      summary: Place a case on a queue from a model or an agent
      operationId: postQueuesQueueidPlacements
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Queue and allocation
        right: C
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementRequest'
      parameters:
      - name: queueId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: 'Response becomes 201 PlacementResult (queueId, overflow, assignment absent when overflow is true, decisionLogEntryId) so a
        placement when every owner is at the cap returns the overflow result. PlacementRequest reason 1 to 1000 characters, version 1 to 40. Errors:
        404 MSG-P2-025 (placement switched off); 409 MSG-P2-024 (already in the queue), MSG-P2-021 (open deviation), MSG-P3-005, MSG-GEN-004;
        422 MSG-P2-020 (caller not approved), MSG-GEN-001, MSG-GEN-002.'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/timers:
    get:
      tags:
      - Work
      summary: 'Read the clocks on a case: stage, service level, prescription, notice'
      operationId: getCasesCaseidTimers
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Timer'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /admin/lists/{listCode}:
    get:
      tags:
      - Administration
      summary: Read a list of values with its versions
      operationId: getAdminListsListcode
      x-module: P4
      x-owner: "P3"
      x-owner-note: "API Specification v4 x-module P4; owner P3 per Microservice Ownership Map v1 (sheet Endpoints) and ASM-0041"
      x-capability:
        area: Reference data
        right: R
      x-first-release: E1
      parameters:
      - name: listCode
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfValues'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /admin/reference-loads:
    post:
      tags:
      - Administration
      summary: 'Load reference data: lists, queues, timers, templates, delegation limits'
      operationId: postAdminReferenceLoads
      x-module: P4
      x-owner: "P3"
      x-owner-note: "API Specification v4 x-module P4; owner P3 per Microservice Ownership Map v1 (sheet Endpoints) and ASM-0041"
      x-capability:
        area: Reference data
        right: C
      x-first-release: E1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                table:
                  type: string
                validFrom:
                  type: string
      description: Add multipart fields changeRequestRef (max 30), impactSummary (max 1000) and rollbackPlan (max 1000). ReferenceLoad adds changeRequestRef,
        impactSummary, rollbackPlan, testResult, verifiedBy (uuid) and verifiedAt (date-time). Approval of a version with a missing checklist
        item or a FAILED test returns 409 with MSG-P3-022. Accept the P5 table codes DOCUMENT_TYPE (RWB-E1-025), DOCUMENT_CHECKLIST (RWB-E1-040),
        RETENTION_CLASS (RWB-E1-041) and DOCUMENT_HUB_PARAMETER (RWB-E1-024), validated by the P5 ReferenceTableLoader implementations; a failed
        check returns 409 or 422 with MSG-P3-027.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceLoad'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /admin/reference-loads/{loadId}/approve:
    post:
      tags:
      - Administration
      summary: Approve a reference data load
      operationId: postAdminReferenceLoadsLoadidApprove
      x-module: P4
      x-owner: "P3"
      x-owner-note: "API Specification v4 x-module P4; owner P3 per Microservice Ownership Map v1 (sheet Endpoints) and ASM-0041"
      x-capability:
        area: Reference data
        right: A
      x-first-release: E1
      parameters:
      - name: loadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: 'Authorization: Reference data A is held by no role. Check the approver role for the load''s table (see gaps) and that the
        caller is not the loader (409 MSG-P7-002). Approval writes a decision log entry with decision code AC-VERS.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceLoad'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
  /cases/{caseId}/next-action:
    get:
      tags:
      - Cases
      summary: Read the next action of a case with its owner, due date, wait and overdue state
      operationId: getCasesCaseidNextAction
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Case record
        right: R
      x-first-release: E2
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextAction'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /cases/export:
    get:
      tags:
      - Cases
      summary: Export the filtered case list to Excel, masked by role, with access event AC-EXPT
      operationId: getCasesExport
      x-module: P3
      x-owner: "P3"
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: product
        in: query
        required: false
        schema:
          type: string
      - name: stage
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: owner
        in: query
        required: false
        schema:
          type: string
      - name: queue
        in: query
        required: false
        schema:
          type: string
      - name: team
        in: query
        required: false
        schema:
          type: string
      - name: deviation
        in: query
        required: false
        schema:

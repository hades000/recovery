components:
  securitySchemes:
    entraId:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration
  responses:
    E400:
      description: Bad request. Messages MSG-GEN-001, MSG-GEN-007 and MSG-PLT-N009-03
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Unauthorized. No valid session, or the person holds no Workbench role. Messages MSG-P4-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Forbidden. The role lacks the right in the capability area. Messages MSG-P4-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found. The record does not exist or is outside the caller's scope. Messages MSG-P4-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflict. The state does not allow the action, the record changed, the approver is above the limit or prepared the decision.
        Messages MSG-P3-005, MSG-GEN-004, MSG-P7-001, MSG-P7-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: Unprocessable. A field fails validation. Messages MSG-GEN-001, MSG-GEN-002, MSG-GEN-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E503:
      description: Service unavailable. The decision could not be recorded, or a system of record is down. Messages MSG-P7-003, MSG-GEN-006
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Case:
      type: object
      description: One recovery case per customer per product, from 90 days past due to close.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the case
          readOnly: true
        caseNo:
          type: string
          maxLength: 18
          description: Case number RW-YYYY-NNNNNN, issued at creation and never reused
        productGroup:
          type: string
          maxLength: 15
          x-list-of-values: LOV-PRODUCT
          description: Mortgage, hire purchase, SSME or unsecured
        primaryPersonKey:
          type: string
          maxLength: 255
          description: ACE person_key of the borrower the case is opened for (v_ace_customer); business key, no foreign key
        status:
          type: string
          maxLength: 20
          enum:
          - NEW
          - ASSIGNED
          - IN_PROGRESS
          - WAITING_CUSTOMER
          - WAITING_PARTNER
          - WAITING_APPROVAL
          - ON_HOLD
          - CLOSED
          description: 'Case status: new, assigned, in progress, waiting customer, waiting partner, waiting approval, on hold, closed'
        stageCode:
          type: string
          maxLength: 20
          enum:
          - RESTRUCTURE
          - SETTLEMENT
          - DEED_IN_LIEU
          - GUARANTEE_CLAIM
          - LITIGATION
          - ASSET_DISPOSAL
          - DEBT_SALE
          - WRITE_OFF
          - DEVIATIONS
          description: The stage the case is on
        routeState:
          type: string
          maxLength: 60
          description: The routing state from the rule set, for example FIRM_INSTRUCTED
        routeCode:
          type: string
          maxLength: 4
          enum:
          - R1
          - R2
          - R3
          - R4
          - R5
          - R6
          - R7
          - R8
          description: The approved route R1 to R8
        ownerUserId:
          type: string
          format: uuid
          description: The case owner
        queueId:
          type: string
          format: uuid
          description: The queue the case is in
        teamCode:
          type: string
          maxLength: 20
          description: The owning team, used by scope rules
        regionCode:
          type: string
          maxLength: 10
          description: The owning region, used by scope rules
        entryDate:
          type: string
          format: date
          description: The date the case entered recovery
        dpdAtEntry:
          type: integer
          description: Days past due on the entry date
        exposureBand:
          type: string
          maxLength: 10
          description: Exposure band set from the outstanding balance at entry
        totalOutstandingAtEntry:
          type: number
          description: Total outstanding across linked accounts at entry, in baht
        prescriptionDate:
          type: string
          format: date
          description: The earliest date a legal claim on the case expires
        stageClockStart:
          type: string
          format: date-time
          description: When the current state started, for the service level
        deviationOpen:
          type: boolean
          description: True while any deviation X1 to X7 is open
        legalHold:
          type: boolean
          description: True while a legal hold stops normal routing
        ruleVersion:
          type: string
          maxLength: 20
          description: The rule version the current state was entered under
        closedDate:
          type: string
          format: date
          description: The date the case closed
        closureReason:
          type: string
          maxLength: 20
          enum:
          - CURED
          - SETTLED
          - REALIZED
          - SOLD
          - WRITTEN_OFF
          - INSURANCE_SETTLED
          - MERGED
          - CANCELED
          description: Cured, settled, realized, sold, written off, insurance settled, merged, canceled
        planRef:
          type: string
          maxLength: 30
          description: Reference of the ACE restructure plan on the case
        planStatus:
          type: string
          maxLength: 10
          enum:
          - CREATED
          - APPROVED
          - BOOKED
          - BROKEN
          description: 'ACE plan status: created, approved, booked or broken'
        planStatusAsOf:
          type: string
          format: date
          description: Date of the plan status in ACE
        nextActionText:
          type: string
          maxLength: 1000
          description: The next action, copied from action_text of the rule that moved the case
        nextActionOwnerRole:
          type: string
          maxLength: 20
          description: Owner role of the next action, from owner_role of the rule
        nextActionDueDate:
          type: string
          format: date
          description: Due date from the rule's timer_spec or the service levels and timers table
        nextActionRuleId:
          type: string
          maxLength: 20
          description: Rule ID that set the next action
        nextActionWaiting:
          type: boolean
          description: True when the next action waits on a customer, party or partner
        lastAllocationDate:
          type: string
          format: date
          description: Business date of the last allocation run that decided the case
        statusBeforeHold:
          type: string
          maxLength: 20
          enum:
          - NEW
          - ASSIGNED
          - IN_PROGRESS
          - WAITING_CUSTOMER
          - WAITING_PARTNER
          - WAITING_APPROVAL
          - ON_HOLD
          - CLOSED
          description: The case status when a legal hold was placed, restored when it is lifted
      required:
      - id
      - caseNo
      - productGroup
      - primaryPersonKey
      - status
      - entryDate
      - dpdAtEntry
      - totalOutstandingAtEntry
      - deviationOpen
      - legalHold
      - nextActionWaiting
    CaseAccount:
      type: object
      description: Links each ACE account to the case it is recovered under.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the case account link
          readOnly: true
        caseId:
          type: string
          format: uuid
          description: The recovery_case this record belongs to
        accountKey:
          type: string
          maxLength: 255
          description: ACE account_key of the account (v_ace_account); business key, no foreign key
        isPrimary:
          type: boolean
          description: True for the account the case was opened on
        linkedFrom:
          type: string
          format: date
          description: Date the account joined the case
        linkedTo:
          type: string
          format: date
          description: Date the account left the case
      required:
      - id
      - caseId
      - accountKey
      - isPrimary
      - linkedFrom
    CaseParty:
      type: object
      description: The role each party plays on a case.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the case party link
          readOnly: true
        caseId:
          type: string
          format: uuid
          description: The recovery_case this record belongs to
        personKey:
          type: string
          maxLength: 255
          description: ACE person_key of the customer (v_ace_customer); business key, no foreign key
        partyRole:
          type: string
          maxLength: 20
          enum:
          - BORROWER
          - CO_BORROWER
          - GUARANTOR
          - AUTHORIZED_SIGNATORY
          - HEIR
          description: Borrower, co-borrower, guarantor, authorized signatory, heir
        roleFrom:
          type: string
          format: date
          description: Date the role starts
        roleTo:
          type: string
          format: date
          description: Date the role ends
      required:
      - id
      - caseId
      - personKey
      - partyRole
      - roleFrom
    Assignment:
      type: object
      description: Who holds a case or a task and from when.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the assignment
          readOnly: true
        caseId:
          type: string
          format: uuid
          description: The recovery_case this record belongs to
        taskId:
          type: string
          format: uuid
          description: The task this record belongs to
        assigneeUserId:
          type: string
          format: uuid
          description: The person or service identity assigned
        assignedAt:
          type: string
          format: date-time
          description: When assigned
        endedAt:
          type: string
          format: date-time
          description: When the assignment ended
        reason:
          type: string
          maxLength: 20
          enum:
          - ALLOCATION
          - TRANSFER
          - REBALANCE
          - MANUAL
          - ESCALATION
          description: Allocation, transfer, rebalance, manual, escalation
        ruleId:
          type: string
          maxLength: 20
          description: The rule that made the assignment
        queueId:
          type: string
          format: uuid
          description: The queue the assignment placed the case in
        transferReasonCode:
          type: string
          maxLength: 20
          enum:
          - R01
          - R02
          - R03
          - R04
          - R05
          - R06
          description: Coded reason for a manual transfer or move
      required:
      - id
      - caseId
      - assigneeUserId
      - assignedAt
      - reason
    Task:
      type: object
      description: 'A unit of work on a case: a CMMN human, customer, partner or decision task.'
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the task
          readOnly: true
        caseId:
          type: string
          format: uuid
          description: The recovery_case this record belongs to
        taskCode:
          type: string
          maxLength: 60
          description: The task in the case model, for example VERIFY_PACK
        elementType:
          type: string
          maxLength: 20
          enum:
          - HUMAN_TASK
          - CUSTOMER_TASK
          - PARTNER_TASK
          - DECISION_TASK
          - STAGE_ENTRY
          - MILESTONE
          - EVENT_LISTENER
          description: Human, customer, partner or decision task, milestone, event listener
        discretion:
          type: string
          maxLength: 15
          enum:
          - AUTOMATIC
          - DISCRETIONARY
          - REQUIRED
          description: Automatic, discretionary, required
        status:
          type: string
          maxLength: 15
          enum:
          - OPEN
          - IN_PROGRESS
          - DONE
          - CANCELED
          description: Open, in progress, done, canceled
        ownerRole:
          type: string
          maxLength: 20
          description: Role that owns the task
        dueAt:
          type: string
          format: date-time
          description: When the task is due
        completedAt:
          type: string
          format: date-time
          description: When it completed
        outcomeCode:
          type: string
          maxLength: 40
          description: The event the task produced
      required:
      - id
      - caseId
      - taskCode
      - elementType
      - discretion
      - status
    Queue:
      type: object
      description: A queue of work belonging to one team and one role.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the queue
          readOnly: true
        queueCode:
          type: string
          maxLength: 30
          description: Queue code
        queueName:
          type: string
          maxLength: 100
          description: Queue name
        teamCode:
          type: string
          maxLength: 20
          description: Team the queue belongs to
        roleCode:
          type: string
          maxLength: 20
          description: Role that works the queue
        assignmentMethod:
          type: string
          maxLength: 20
          enum:
          - ROUND_ROBIN
          - LOWEST_LOAD
          - NAMED_OWNER
          - SKILL
          description: Round robin, lowest load, named owner, skill
        capacityCap:
          type: integer
          description: Most open cases one person may hold in the queue
        overflowQueueId:
          type: string
          format: uuid
          description: Queue that receives overflow
        rrCursorUserId:
          type: string
          format: uuid
          description: The member last given a case by round robin in the queue
        tableVersion:
          type: integer
          description: The QUEUE reference version applied to the row
      required:
      - id
      - queueCode
      - queueName
      - teamCode
      - roleCode
      - assignmentMethod
    Timer:
      type: object
      description: 'A running clock on a case: a service level, a legal period or an offer validity.'
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the timer
          readOnly: true
        caseId:
          type: string
          format: uuid
          description: The recovery_case this record belongs to
        taskId:
          type: string
          format: uuid
          description: The task this record belongs to
        timerType:
          type: string
          maxLength: 20
          enum:
          - SERVICE_LEVEL
          - NOTICE_PERIOD
          - CURE_PERIOD
          - PRESCRIPTION
          - HEARING_DEADLINE
          - OFFER_VALIDITY
          - HOLDING_AGE
          - CLAIM_DEADLINE
          - INSTALLMENT_DUE
          description: Service level, notice period, cure period, prescription, hearing deadline, offer validity, holding age, claim deadline
        startedAt:
          type: string
          format: date-time
          description: When it started
        expiresAt:
          type: string
          format: date-time
          description: When it expires
        warnAt:
          type: string
          format: date-time
          description: When the warning is raised
        paused:
          type: boolean
          description: True while paused by a deviation. A prescription timer never pauses
        status:
          type: string
          maxLength: 15
          enum:
          - RUNNING
          - PAUSED
          - EXPIRED
          - STOPPED
          description: Running, paused, expired, stopped
        escalationLevel:
          type: integer
          description: How many times it has escalated
        warnedAt:
          type: string
          format: date-time
          description: When the warning was sent, so it is sent once
        treatmentId:
          type: string
          format: uuid
          description: The treatment a plan timer belongs to
        escalatedToRole:
          type: string
          maxLength: 20
          description: Role the breach was last escalated to
        escalatedAt:
          type: string
          format: date-time
          description: When the timer last escalated
      required:
      - id
      - caseId
      - timerType
      - startedAt
      - expiresAt
      - paused
      - status
      - escalationLevel
    TransferRequest:
      type: object
      properties:
        toOwnerId:
          type: string
          format: uuid
        toQueueId:
          type: string
          format: uuid
        reasonCode:
          type: string
          enum:
          - ALLOCATION
          - TRANSFER
          - REBALANCE
          - MANUAL
          - ESCALATION
        note:
          type: string
    LegalHoldRequest:
      type: object
      properties:
        action:
          type: string
          enum:
          - place
          - lift
        reason:
          type: string
        reference:
          type: string
    TaskUpdate:
      type: object
      properties:
        status:
          type: string
          enum:
          - OPEN
          - IN_PROGRESS
          - DONE
          - CANCELED
        assigneeId:
          type: string
          format: uuid
        note:
          type: string
    PlacementRequest:
      type: object
      properties:
        caseId:
          type: string
          format: uuid
        reason:
          type: string
        modelOrAgent:
          type: string
        version:
          type: string
    ListOfValues:
      type: object
      properties:
        code:
          type: string
        values:
          type: object
    ReferenceLoad:
      type: object
      properties:
        id:
          type: string
          format: uuid
        table:
          type: string
        validFrom:
          type: string
          format: date

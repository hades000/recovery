# 5.1.0, 27 November 2026, D-RCV-60 P1 developer readiness (RD-P1 register), targeted edits

asyncapi: 3.0.0
info:
  title: "Recovery Workbench events - rwb-document"
  version: 5.1.0
  description: >-
    AsyncAPI 3.0 contract for the business-event topic of rwb-document (Document, module P5). One document per
    service, as Arch v5 slide 42 notes require; the document set is version 5.0.0 of 22 November 2026 (D-RCV-60
    microservice realignment).
    Producer and consumer names are those of the Arch v5 event catalogue, slides 42 and 43; payload field names
    are those of Event and Messaging Design v4 (sheet Events, payload column). Property types, required flags
    and formats are not specified in the source documents (GAP-0096; ASM-0160).
    Events carry IDs and facts, never personal data (Arch v5 slide 42 notes).
x-topic:
  name: "rwb.document.events.v1"
  partitions: 12
  replication-factor: 3
  retention: "7 days"
  key: "caseId"
  mode: "CloudEvents 1.0 Kafka binding, binary mode (ce_* headers)"
  retry: "retry topics 1 min, 10 min, 1 h, then .dlt with alert"
  schema-registry: "JSON Schema registry, BACKWARD compatibility"
  fallback: "Event Hubs Premium"
  source: "Arch v5 slide 35 (Kafka line) and slide 42 notes"
  dead-letter: "rwb.document.events.v1.dlt"
  dead-letter-note: "Top-level name derived by appending .dlt to the service topic (Template and Rules R4)"
defaultContentType: "application/cloudevents+json"
channels:
  "rwb.document.events.v1":
    address: "rwb.document.events.v1"
    title: "rwb.document.events.v1"
    messages:
      DocumentStored:
        $ref: '#/components/messages/DocumentStored'
      DocumentFieldsExtracted:
        $ref: '#/components/messages/DocumentFieldsExtracted'
operations:
  publishDocumentStored:
    action: send
    channel:
      $ref: '#/channels/rwb.document.events.v1'
    summary: "Publish DocumentStored (EV-16) to rwb.document.events.v1"
    messages:
    - $ref: '#/channels/rwb.document.events.v1/messages/DocumentStored'
  publishDocumentFieldsExtracted:
    action: send
    channel:
      $ref: '#/channels/rwb.document.events.v1'
    summary: "Publish DocumentFieldsExtracted (EV-17) to rwb.document.events.v1"
    messages:
    - $ref: '#/channels/rwb.document.events.v1/messages/DocumentFieldsExtracted'
x-shared-topics:
- name: "rwb.decision-record.v1"
  asyncapi: "asyncapi/rwb.decision-record.v1.asyncapi.yaml"
  note: "Every service publishes DecisionRecorded (DP-03); the shared contract sits in one document"
components:
  messages:
    DocumentStored:
      name: "rwb.document.DocumentStored.v1"
      title: "DocumentStored"
      summary: "EV-16 DocumentStored"
      description: "Produced by rwb-document; consumers: rwb-agent, rwb-case, rwb-source-data"
      x-consumers: ["rwb-agent", "rwb-case", "rwb-source-data"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/DocumentStoredHeaders'
      payload:
        $ref: '#/components/schemas/DocumentStoredEvent'
    DocumentFieldsExtracted:
      name: "rwb.document.DocumentFieldsExtracted.v1"
      title: "DocumentFieldsExtracted"
      summary: "EV-17 DocumentFieldsExtracted"
      description: "Produced by rwb-document; consumers: rwb-case"
      x-consumers: ["rwb-case"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/DocumentFieldsExtractedEvent'
  schemas:
    CloudEventsHeaders:
      type: object
      description: "CloudEvents 1.0 Kafka binding in binary mode; ce_* headers (Arch v5 slide 35)"
      properties:
        ce_specversion:
          type: string
        ce_id:
          type: string
          description: "Event ID; also the idempotency key (Event and Messaging Design v4, sheet Rules)"
        ce_source:
          type: string
        ce_type:
          type: string
        ce_time:
          type: string
          format: date-time
        ce_subject:
          type: string
          description: "Kafka key: caseId (Arch v5 slide 35)"
        ce_datacontenttype:
          type: string
    DocumentStoredHeaders:
      allOf:
      - $ref: '#/components/schemas/CloudEventsHeaders'
      - type: object
        properties:
          ce_idempotencykey:
              type: string
              maxLength: 120
              description: "Business key <code>-<caseNo>-<yyyyMMdd>-<actionId> (RD-P1-007, RD-P1-009)"
          ce_actor:
              type: string
              maxLength: 74
              description: "USER:<userId>, SERVICE:<service name> or PARTNER:<partnerCode> (RD-P1-009)"
        required: [ce_idempotencykey, ce_actor]
    DocumentStoredEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.document.DocumentStored.v1"
          data:
            type: object
            description: "EV-16 DocumentStored payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              documentId: {}
              caseId: {}
              type: {}
              source: {}
    DocumentFieldsExtractedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.document.DocumentFieldsExtracted.v1"
          data:
            type: object
            description: "EV-17 DocumentFieldsExtracted payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              documentId: {}
              fields: {}
              confidence: {}
    CloudEventEnvelope:
      type: object
      description: "CloudEvents 1.0 envelope (specversion, id, source, type, time, subject, data); Kafka binary mode carries the attributes in ce_* headers (Arch v5 slide 35)"
      required: [specversion, id, source, type, time, subject, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
        source:
          type: string
        type:
          type: string
        time:
          type: string
          format: date-time
        subject:
          type: string
        datacontenttype:
          type: string
        data:
          type: object

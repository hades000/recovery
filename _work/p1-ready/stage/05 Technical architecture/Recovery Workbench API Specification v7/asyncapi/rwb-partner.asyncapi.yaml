asyncapi: 3.0.0
info:
  title: "Recovery Workbench events - rwb-partner"
  version: 5.0.0
  description: >-
    AsyncAPI 3.0 contract for the business-event topic of rwb-partner (Partner, module S9). One document per
    service, as Arch v5 slide 42 notes require; the document set is version 5.0.0 of 22 November 2026 (D-RCV-60
    microservice realignment).
    Producer and consumer names are those of the Arch v5 event catalogue, slides 42 and 43; payload field names
    are those of Event and Messaging Design v4 (sheet Events, payload column). Property types, required flags
    and formats are not specified in the source documents (GAP-0096; ASM-0160).
    Events carry IDs and facts, never personal data (Arch v5 slide 42 notes).
x-topic:
  name: "rwb.partner.events.v1"
  partitions: 12
  replication-factor: 3
  retention: "7 days"
  key: "caseId"
  mode: "CloudEvents 1.0 Kafka binding, binary mode (ce_* headers)"
  retry: "retry topics 1 min, 10 min, 1 h, then .dlt with alert"
  schema-registry: "JSON Schema registry, BACKWARD compatibility"
  fallback: "Event Hubs Premium"
  source: "Arch v5 slide 35 (Kafka line) and slide 42 notes"
  dead-letter: "rwb.partner.events.v1.dlt"
  dead-letter-note: "Top-level name derived by appending .dlt to the service topic (Template and Rules R4)"
defaultContentType: "application/cloudevents+json"
channels:
  "rwb.partner.events.v1":
    address: "rwb.partner.events.v1"
    title: "rwb.partner.events.v1"
    messages:
      InstructionIssued:
        $ref: '#/components/messages/InstructionIssued'
      PartnerResultSubmitted:
        $ref: '#/components/messages/PartnerResultSubmitted'
operations:
  publishInstructionIssued:
    action: send
    channel:
      $ref: '#/channels/rwb.partner.events.v1'
    summary: "Publish InstructionIssued (EV-20) to rwb.partner.events.v1"
    messages:
    - $ref: '#/channels/rwb.partner.events.v1/messages/InstructionIssued'
  publishPartnerResultSubmitted:
    action: send
    channel:
      $ref: '#/channels/rwb.partner.events.v1'
    summary: "Publish PartnerResultSubmitted (EV-21) to rwb.partner.events.v1"
    messages:
    - $ref: '#/channels/rwb.partner.events.v1/messages/PartnerResultSubmitted'
x-shared-topics:
- name: "rwb.decision-record.v1"
  asyncapi: "asyncapi/rwb.decision-record.v1.asyncapi.yaml"
  note: "Every service publishes DecisionRecorded (DP-03); the shared contract sits in one document"
components:
  messages:
    InstructionIssued:
      name: "rwb.partner.InstructionIssued.v1"
      title: "InstructionIssued"
      summary: "EV-20 InstructionIssued"
      description: "Produced by rwb-partner; consumers: partner portal"
      x-consumers: ["partner portal"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/InstructionIssuedEvent'
    PartnerResultSubmitted:
      name: "rwb.partner.PartnerResultSubmitted.v1"
      title: "PartnerResultSubmitted"
      summary: "EV-21 PartnerResultSubmitted"
      description: "Produced by rwb-partner; consumers: rwb-litigation, rwb-asset, rwb-case"
      x-consumers: ["rwb-litigation", "rwb-asset", "rwb-case"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/PartnerResultSubmittedEvent'
  schemas:
    CloudEventsHeaders:
      type: object
      description: "CloudEvents 1.0 Kafka binding in binary mode; ce_* headers (Arch v5 slide 35)"
      properties:
        ce_specversion:
          type: string
        ce_id:
          type: string
          description: "Event ID; also the idempotency key (Event and Messaging Design v4, sheet Rules)"
        ce_source:
          type: string
        ce_type:
          type: string
        ce_time:
          type: string
          format: date-time
        ce_subject:
          type: string
          description: "Kafka key: caseId (Arch v5 slide 35)"
        ce_datacontenttype:
          type: string
    InstructionIssuedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.partner.InstructionIssued.v1"
          data:
            type: object
            description: "EV-20 InstructionIssued payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              instructionId: {}
              partnerId: {}
              type: {}
              dueOn: {}
    PartnerResultSubmittedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.partner.PartnerResultSubmitted.v1"
          data:
            type: object
            description: "EV-21 PartnerResultSubmitted payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              instructionId: {}
              result: {}
              documents: {}
    CloudEventEnvelope:
      type: object
      description: "CloudEvents 1.0 envelope (specversion, id, source, type, time, subject, data); Kafka binary mode carries the attributes in ce_* headers (Arch v5 slide 35)"
      required: [specversion, id, source, type, time, subject, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
        source:
          type: string
        type:
          type: string
        time:
          type: string
          format: date-time
        subject:
          type: string
        datacontenttype:
          type: string
        data:
          type: object

asyncapi: 3.0.0
info:
  title: "Recovery Workbench events - rwb-access"
  version: 5.0.0
  description: >-
    AsyncAPI 3.0 contract for the business-event topic of rwb-access (Access and authority, module P4). One
    document per service, as Arch v5 slide 42 notes require; the document set is version 5.0.0 of 22 November
    2026 (D-RCV-60 microservice realignment).
    Producer and consumer names are those of the Arch v5 event catalogue, slides 42 and 43; payload field names
    are those of Event and Messaging Design v4 (sheet Events, payload column). Property types, required flags
    and formats are not specified in the source documents (GAP-0096; ASM-0160).
    Events carry IDs and facts, never personal data (Arch v5 slide 42 notes).
x-topic:
  name: "rwb.access.events.v1"
  partitions: 12
  replication-factor: 3
  retention: "7 days"
  key: "caseId"
  mode: "CloudEvents 1.0 Kafka binding, binary mode (ce_* headers)"
  retry: "retry topics 1 min, 10 min, 1 h, then .dlt with alert"
  schema-registry: "JSON Schema registry, BACKWARD compatibility"
  fallback: "Event Hubs Premium"
  source: "Arch v5 slide 35 (Kafka line) and slide 42 notes"
  dead-letter: "rwb.access.events.v1.dlt"
  dead-letter-note: "Top-level name derived by appending .dlt to the service topic (Template and Rules R4)"
defaultContentType: "application/cloudevents+json"
channels:
  "rwb.access.events.v1":
    address: "rwb.access.events.v1"
    title: "rwb.access.events.v1"
    messages:
      AccessPolicyChanged:
        $ref: '#/components/messages/AccessPolicyChanged'
      DoaLimitChanged:
        $ref: '#/components/messages/DoaLimitChanged'
operations:
  publishAccessPolicyChanged:
    action: send
    channel:
      $ref: '#/channels/rwb.access.events.v1'
    summary: "Publish AccessPolicyChanged to rwb.access.events.v1"
    messages:
    - $ref: '#/channels/rwb.access.events.v1/messages/AccessPolicyChanged'
  publishDoaLimitChanged:
    action: send
    channel:
      $ref: '#/channels/rwb.access.events.v1'
    summary: "Publish DoaLimitChanged to rwb.access.events.v1"
    messages:
    - $ref: '#/channels/rwb.access.events.v1/messages/DoaLimitChanged'
x-shared-topics:
- name: "rwb.decision-record.v1"
  asyncapi: "asyncapi/rwb.decision-record.v1.asyncapi.yaml"
  note: "Every service publishes DecisionRecorded (DP-03); the shared contract sits in one document"
components:
  messages:
    AccessPolicyChanged:
      name: "rwb.access.AccessPolicyChanged.v1"
      title: "AccessPolicyChanged"
      summary: "AccessPolicyChanged"
      description: "Produced by rwb-access; consumers: all (cache refresh)"
      x-consumers: ["all (cache refresh)"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/AccessPolicyChangedEvent'
    DoaLimitChanged:
      name: "rwb.access.DoaLimitChanged.v1"
      title: "DoaLimitChanged"
      summary: "DoaLimitChanged"
      description: "Produced by rwb-access; consumers: all (cache refresh)"
      x-consumers: ["all (cache refresh)"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/DoaLimitChangedEvent'
  schemas:
    CloudEventsHeaders:
      type: object
      description: "CloudEvents 1.0 Kafka binding in binary mode; ce_* headers (Arch v5 slide 35)"
      properties:
        ce_specversion:
          type: string
        ce_id:
          type: string
          description: "Event ID; also the idempotency key (Event and Messaging Design v4, sheet Rules)"
        ce_source:
          type: string
        ce_type:
          type: string
        ce_time:
          type: string
          format: date-time
        ce_subject:
          type: string
          description: "Kafka key: caseId (Arch v5 slide 35)"
        ce_datacontenttype:
          type: string
    AccessPolicyChangedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.access.AccessPolicyChanged.v1"
          data:
            type: object
            description: "Payload of AccessPolicyChanged is Not specified in the source documents (GAP-0096; ASM-0160): Arch v5 slide 43 lists the event name only, with no payload column"
            properties: {}
    DoaLimitChangedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.access.DoaLimitChanged.v1"
          data:
            type: object
            description: "Payload of DoaLimitChanged is Not specified in the source documents (GAP-0096; ASM-0160): Arch v5 slide 43 lists the event name only, with no payload column"
            properties: {}
    CloudEventEnvelope:
      type: object
      description: "CloudEvents 1.0 envelope (specversion, id, source, type, time, subject, data); Kafka binary mode carries the attributes in ce_* headers (Arch v5 slide 35)"
      required: [specversion, id, source, type, time, subject, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
        source:
          type: string
        type:
          type: string
        time:
          type: string
          format: date-time
        subject:
          type: string
        datacontenttype:
          type: string
        data:
          type: object

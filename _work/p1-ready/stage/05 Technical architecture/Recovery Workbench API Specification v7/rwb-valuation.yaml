openapi: 3.1.0
info:
  title: "Recovery Workbench API - rwb-valuation (Valuation and route)"
  version: 5.1.0
  description: >-
    Operations of the Recovery Workbench API that belong to rwb-valuation (Valuation and route, module S1,
    service wave 3) under Microservice Ownership Map v1, split from Recovery Workbench API Specification v4
    (4.0.0, 16 November 2026) by the D-RCV-60 microservice realignment.
    This document holds 2 operations under REST base /api/recovery/valuation/v1; schema rwb_valuation; topic
    rwb.valuation.events.v1; Temporal task queue rwb-valuation in namespace rwb-recovery. The v4 text of every
    operation, parameter, schema, response, number and date is kept unchanged.
    Moved into this document from another module of v4: POST /assets/{assetKey}/valuations (x-module S5, owner
    S1).
    Moved out of this document to another service: none.
    The v4 document description, the tag list and the document map are kept in index.yaml; the event contract of
    the service is in asyncapi/rwb-valuation.asyncapi.yaml.
servers:
- url: "/api/recovery/valuation/v1"
  description: "Relative to the rwb-valuation service in each environment"
security:
- entraId: []
tags:
- name: "Treatment"
- name: "Assets"
x-service:
  code: "S1"
  service: "rwb-valuation"
  name: "Valuation and route"
  wave: 3
  schema: "rwb_valuation"
  rest-base: "/api/recovery/valuation/v1"
  topic: "rwb.valuation.events.v1"
  task-queue: "rwb-valuation"
  namespace: "rwb-recovery"
  asyncapi: "asyncapi/rwb-valuation.asyncapi.yaml"
  operations: 2
paths:
  /cases/{caseId}/route:
    post:
      tags:
      - Treatment
      summary: Submit the route decision for approval, with an override reason where it departs from the recommendation
      operationId: postCasesCaseidRoute
      x-module: S1
      x-owner: "S1"
      x-capability:
        area: Treatment and offer
        right: U
      x-first-release: E4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /assets/{assetKey}/valuations:
    post:
      tags:
      - Assets
      summary: Order a valuation, or accept an ACE appraisal for the route decision
      operationId: postAssetsAssetkeyValuations
      x-module: S5
      x-owner: "S1"
      x-owner-note: "API Specification v4 x-module S5; owner S1 per Microservice Ownership Map v1 (sheet Endpoints) and ASM-0043"
      x-capability:
        area: Asset and disposal
        right: C
      x-first-release: E3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValuationRequest'
      parameters:
      - name: assetKey
        in: path
        required: true
        schema:
          type: string
          maxLength: 255
        description: ACE asset_key of the held asset (v_ace_npa_asset)
      description: 'D-RCV-35: SVAF appraisals arrive through ACE ingestion and are read through v_ace_valuation. This request orders a valuation
        from a valuer or records the Workbench acceptance in valuation_ext; it never writes an appraised value.'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Valuation'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
components:
  securitySchemes:
    entraId:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration
  responses:
    E401:
      description: Unauthorized. No valid session, or the person holds no Workbench role. Messages MSG-P4-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Forbidden. The role lacks the right in the capability area. Messages MSG-P4-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found. The record does not exist or is outside the caller's scope. Messages MSG-P4-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflict. The state does not allow the action, the record changed, the approver is above the limit or prepared the decision.
        Messages MSG-P3-005, MSG-GEN-004, MSG-P7-001, MSG-P7-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: Unprocessable. A field fails validation. Messages MSG-GEN-001, MSG-GEN-002, MSG-GEN-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E503:
      description: Service unavailable. The decision could not be recorded, or a system of record is down. Messages MSG-P7-003, MSG-GEN-006
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Valuation:
      type: object
      description: An appraisal of an asset, read from ACE through v_ace_valuation (SVAF), with the Workbench decision from valuation_ext.
      properties:
        valuationKey:
          type: string
          maxLength: 255
          description: ACE valuation_key of the appraisal; business key
        assetKey:
          type: string
          maxLength: 255
          description: ACE asset_key of the asset appraised
        appraisalNo:
          type: string
          maxLength: 20
          description: Appraisal number
        appraisalType:
          type: string
          maxLength: 15
          enum:
          - MARKET
          - OFFICIAL
          - FORCED_SALE
          - DESKTOP
          - AGENT_ESTIMATE
          description: Market, official, forced sale, desktop, agent estimate
        appraisedValue:
          type: number
          description: Appraised value, baht
        forcedSaleValue:
          type: number
          description: Forced sale value, baht
        appraisalDate:
          type: string
          format: date
          description: Appraisal date
        valuerPartnerId:
          type: string
          format: uuid
          description: The valuer, from valuation_ext
        accepted:
          type: boolean
          description: True once accepted for the route decision, from valuation_ext
        staleFlag:
          type: boolean
          description: True when the appraisal is older than appraisal.max.age at the ACE business date, from valuation_ext
        ageDays:
          type: integer
          description: Age of the appraisal in days at the ACE business date, from valuation_ext
      required:
      - valuationKey
      - appraisalNo
      - appraisalType
      - appraisedValue
      - appraisalDate
      - accepted
      - staleFlag
    RouteRequest:
      type: object
      properties:
        route:
          type: string
          enum:
          - R1
          - R2
          - R3
          - R4
          - R5
          - R6
          - R7
          - R8
        overrideReasonCode:
          type: string
        note:
          type: string
    ValuationRequest:
      type: object
      properties:
        appraisalType:
          type: string
          enum:
          - MARKET
          - OFFICIAL
          - FORCED_SALE
          - DESKTOP
          - AGENT_ESTIMATE
        valuerId:
          type: string
          format: uuid
        valuationKey:
          type: string
          maxLength: 255
          description: ACE valuation_key of the appraisal to accept; empty when ordering
        accepted:
          type: boolean
          description: True to accept the appraisal for the route decision
      description: Order a valuation, or accept an ACE appraisal. The appraised value arrives through ACE ingestion, not through this request.
    Approval:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        decision:
          type: string
        preparedBy:
          type: string
        level:
          type: string
        amount:
          type: number
        status:
          type: string
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: URI of the error-map row
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: Request path and trace ID, stamped by the owning service
        messageCode:
          type: string
          pattern: '^MSG-[A-Z0-9]+(?:-[A-Z0-9]+)*-[0-9]{2,3}$'
        messageTh:
          type: string
          description: Thai text of the message code
        field:
          type: string
          description: JSON Pointer or parameter or header name of the first failing input
        errors:
          type: array
          description: Present only on 400 or 422 when more than one input fails
          items:
            type: object
            properties:
              field:
                type: string
              messageCode:
                type: string
                pattern: '^MSG-[A-Z0-9]+(?:-[A-Z0-9]+)*-[0-9]{2,3}$'
              detail:
                type: string
            required: [field, messageCode, detail]
        traceId:
          type: string
          pattern: '^[0-9a-fA-F]{32}$'
          description: 32-hex W3C trace ID of the request
      required: [type, title, status, messageCode, traceId]

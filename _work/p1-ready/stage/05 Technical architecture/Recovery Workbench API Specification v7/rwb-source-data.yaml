  /business-days/{date}/ready:
    post:
      tags: [Administration]
      summary: Start the readiness check for a business date
      operationId: postBusinessDaysDateReady
      x-module: P1
      x-owner: P1
      x-capability:
        area: Platform administration
        right: U
      x-first-release: E1
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 'Readiness check accepted. While rwb.dataengine.freshness-stamp is off, record the readiness row and start no AceIngestCheck (RD-P1-080). A date that already has a business_day_readiness row answers 202 with the stored state: while AceIngestCheck runs the call attaches (USE_EXISTING); once the row is DONE or LATE it starts nothing. A second ReconciliationWorkflow run of a date exists only through the rerun of a FAILED run (RD-P1-040, RD-P1-065).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDayStatus'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          description: Idempotency key conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /business-days/{date}/status:
    get:
      tags: [Administration]
      summary: Read readiness status for a business date
      operationId: getBusinessDaysDateStatus
      x-module: P1
      x-owner: P1
      x-capability:
        area: Platform administration
        right: R
      x-first-release: E1
      parameters:

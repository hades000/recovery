openapi: 3.1.0
info:
  title: "Recovery Workbench API - rwb-source-data (Source data)"
  version: 5.1.0
  description: >-
    Operations of the Recovery Workbench API that belong to rwb-source-data (Source data, module P1, service
    wave 1) under Microservice Ownership Map v1, split from Recovery Workbench API Specification v4 (4.0.0, 16
    November 2026) by the D-RCV-60 microservice realignment.
    This document holds 32 operations under REST base /api/recovery/source-data/v1; schema rwb_source_data;
    topic rwb.source-data.events.v1; Temporal task queue rwb-source-data in namespace rwb-recovery. The v4 text
    of every operation, parameter, schema, response, number and date is kept unchanged.
    Moved into this document from another module of v4: GET /cases/{caseId}/interactions (x-module P3, owner
    P1); POST /cases/{caseId}/interactions (x-module P3, owner P1).
    Moved out of this document to another service: none.
    Added by the D-RCV-60 P1 developer readiness run: GET /customers/{personKey}, GET /accounts/{accountKey} and
    GET /collateral/{assetKey} (RD-P1-060).
    Pending: account-page read path and maximum keys per call, owner Solution architect, tracked as GAP-3274.
    The v4 document description, the tag list and the document map are kept in index.yaml; the event contract of
    the service is in asyncapi/rwb-source-data.asyncapi.yaml.
servers:
- url: "/api/recovery/source-data/v1"
  description: "Relative to the rwb-source-data service in each environment"
security:
- entraId: []
tags:
- name: "Cases"
- name: "Interactions"
- name: "Administration"
x-service:
  code: "P1"
  service: "rwb-source-data"
  name: "Source data"
  wave: 1
  schema: "rwb_source_data"
  rest-base: "/api/recovery/source-data/v1"
  topic: "rwb.source-data.events.v1"
  task-queue: "rwb-source-data"
  namespace: "rwb-recovery"
  asyncapi: "asyncapi/rwb-source-data.asyncapi.yaml"
  operations: 32
paths:
  /cases/{caseId}/interactions:
    get:
      tags:
      - Interactions
      summary: Read the interaction ledger for a case
      operationId: getCasesCaseidInteractions
      x-module: P3
      x-owner: "P1"
      x-owner-note: "API Specification v4 x-module P3; owner P1 per Microservice Ownership Map v1 (sheet Endpoints) and ASM-0038"
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: channel
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: actor
        in: query
        required: false
        description: Matches actorRef
        schema:
          type: string
          maxLength: 64
      description: Interaction adds eventCode (string), caseSeq (integer), actorType (string), actorRef (string), sourceRef
        (string) and decisionLogEntryId (uuid); summary masked by role. Errors add 422 (MSG-GEN-001, MSG-GEN-002, MSG-GEN-003); 503 when the access
        event cannot be written (MSG-GEN-006). Interaction adds the channel ledger fields contactKey (string, composite contact_type:key from v_ace_contact),
        fromHolderRef (string), toHolderRef (string), treatmentId (uuid), proceedsId (uuid) and retentionClass (string). An empty ledger returns
        an empty page with MSG-P3-024. While the flag rwb.dataengine.ledger-read is off the operation answers 404 (RD-P1-045).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
    post:
      tags:
      - Interactions
      summary: Record a contact, promise or hand-over
      operationId: postCasesCaseidInteractions
      x-module: P3
      x-owner: "P1"
      x-owner-note: "API Specification v4 x-module P3; owner P1 per Microservice Ownership Map v1 (sheet Endpoints) and ASM-0038"
      x-capability:
        area: Case record
        right: C
      x-first-release: E1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionRequest'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: 'Schema Interaction adds deliveryStatus (string) and externalRef (string), returned by POST /cases/{caseId}/messages and in
        the ledger. REST callers, each under its own workload identity: rwb-case, rwb-comms, rwb-integration, rwb-document, rwb-payment,
        rwb-treatment and rwb-partner; rwb-source-data appends in process (RD-P1-007, RD-P1-064). The same Idempotency-Key with another body
        answers 409 MSG-PLT-N009-05; a new key with an existing business key answers 200 with the existing entry. On 503 MSG-P1-022 the caller
        does not commit its action, or retries with the same header key and business key. While the flag rwb.dataengine.ledger-writer is off
        the append path answers 404 (RD-P1-045).'
      responses:
        '200':
          description: Business key repeat; returns the existing entry without allocating another caseSeq
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /admin/jobs:
    get:
      tags: [Administration]
      summary: List rwb-source-data job runs
      operationId: getAdminJobs
      x-module: P1
      x-owner: P1
      x-capability:
        area: Platform administration
        right: R
      x-first-release: E1
      parameters:
      - name: type
        in: query
        required: false
        description: JOB-nn or workflow type string
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [PENDING, RUNNING, COMPLETE, FAILED, WAITING]
      - name: from
        in: query
        required: false
        description: Inclusive businessDate; defaults to today minus 7 days in Asia/Bangkok
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        description: Inclusive businessDate; defaults to today in Asia/Bangkok
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      description: 'One item per rwb-source-data run, ordered by startedAt descending. P1 jobs are AceIngestCheck, ReconciliationWorkflow (JOB-04), Stage2ProductWorkflow and RetentionRunWorkflow. Cross-service job monitoring is a gateway-bff composite. Errors 422: size outside its range (MSG-GEN-002) or from later than to (MSG-GEN-003). While the flag rwb.p1.jobmonitor is off both job operations answer 404 MSG-P4-003 (RD-P1-045).'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /admin/jobs/{jobId}/rerun:
    post:
      tags: [Administration]
      summary: Rerun a failed rwb-source-data job run
      operationId: postAdminJobsJobidRerun
      x-module: P1
      x-owner: P1
      x-capability:
        area: Platform administration
        right: U
      x-first-release: E1
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Run ID of a FAILED P1 run
      - $ref: '#/components/parameters/IdempotencyKey'
      description: 'Only a FAILED run is rerun: a new run for the same business date, started with Temporal reuse policy ALLOW_DUPLICATE_FAILED_ONLY. A complete or running run answers 409 MSG-P1-011 (RD-P1-012, RD-P1-065). While the flag rwb.p1.jobmonitor is off the operation answers 404 MSG-P4-003 (RD-P1-045).'
      responses:
        '202':
          description: New asynchronous run, status PENDING and runNo incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          description: MSG-P1-011 if the run is not FAILED or another run is active; MSG-P1-001 if the ACE batch is not COMPLETED; MSG-PLT-N009-05 for key reuse
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /data-products/freshness:
    get:
      tags:
      - Cases
      summary: Read the freshness stamp of each data product from the ACE batch business date
      operationId: getDataProductsFreshness
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: product
        in: query
        required: false
        schema:
          type: string
          pattern: '^DP(0[1-9]|1[0-4])$'
      - name: asOf
        in: query
        required: false
        schema:
          type: string
      description: 'D-RCV-35: the stamp is data_product_load, written from recovery.v_ace_batch_status over ACE ace_batch_run (RWB-ACE-001). The
        Workbench loads nothing: businessDate is the ACE business date of the last completed source batch, sourceExtractedAt its completion time,
        loadedAt when the Workbench recorded the stamp. A product is stale when no completed batch exists for the expected business date (RWB-E1-015). A never-stamped product answers businessDate null, status STALE, staleSince null and no sourceExtractedAt or loadedAt; a reader treats it as having no data date (RD-P1-062).'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataProductFreshness'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /data-products/{productCode}/records:
    get:
      tags:
      - Cases
      summary: Read the rows of one data product for a case through the ACE views, masked by role, with its freshness stamp
      operationId: getDataProductsProductcodeRecords
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: productCode
        in: path
        required: true
        schema:
          type: string
          pattern: '^DP(0[1-9]|1[0-4])$'
      - name: caseId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      description: 'D-RCV-35: source rows are read live through the recovery.v_ace_* views (for example v_ace_account, v_ace_payment, v_ace_customer,
        v_ace_contact, v_ace_collateral), filtered by the case''s account_key and person_key values; Workbench rows come from the recovery tables
        and the extension tables. Nothing is copied. Masking is applied by role (RWB-E1-037) and every read is written to the access log. A DP02 contact row has the fields contactKey, contactType, consentStatus (GIVEN, WITHDRAWN, UNKNOWN) and verifiedAt; no contact value, address, name or identity number (RWB-P1-E2021-APP).'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProductRecordPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /admin/data-products:
    get:
      tags:
      - Administration
      summary: List the data catalog entries
      operationId: getAdminDataProducts
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Platform administration
        right: R
      x-first-release: E1
      parameters:
      - name: product
        in: query
        required: false
        schema:
          type: string
      description: 'D-RCV-35: the catalog lists each data product with its read path. Source products name ACE as the system of record ("ACE (ingested
        from X)") and the v_ace_* views they read; Workbench products name the recovery tables.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataProductCatalogEntry'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /admin/data-dictionary/fields:
    get:
      tags:
      - Administration
      summary: Search the data dictionary
      operationId: getAdminDataDictionaryFields
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Reference data
        right: R
      x-first-release: E1
      parameters:
      - name: product
        in: query
        required: false
        schema:
          type: string
      - name: entity
        in: query
        required: false
        schema:
          type: string
      - name: field
        in: query
        required: false
        schema:
          type: string
      - name: sourceSystem
        in: query
        required: false
        schema:
          type: string
          enum: [ACE, WORKBENCH]
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      description: 'D-RCV-35: reads v_data_dictionary over sys_objects and sys_fields: at least 123 objects (93 tables and 30 v_ace_* views) and 1,379
        fields (RD-P1-025). A view field carries sourceSystem ACE and sourceField the ACE column it maps (for example public.account.delay_days for days_past_due).
        The sourceSystem filter takes ACE or WORKBENCH.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDictionaryFieldPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'

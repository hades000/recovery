        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '428':
          $ref: '#/components/responses/E428'
        '503':
          $ref: '#/components/responses/E503'
  /admin/data-contracts:
    get:
      tags:
      - Administration
      summary: 'List data contracts: the ACE view contract and the outbound interfaces'
      operationId: getAdminDataContracts
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Reference data
        right: R
      x-first-release: E1
      parameters:
      - name: sourceSystem
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      description: 'D-RCV-35: there is no inbound load contract. The ACE contract is the v_ace_* view list and the RWB-ACE-001 field appendix,
        confirmed by the ACE team lead (DL43); the other contracts cover outbound interfaces only.'
      responses:
        '200':
          description: Success
          content:

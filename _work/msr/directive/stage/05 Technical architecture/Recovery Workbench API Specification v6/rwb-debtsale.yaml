openapi: 3.1.0
info:
  title: "Recovery Workbench API - rwb-debtsale (Debt sale)"
  version: 5.0.0
  description: >-
    Operations of the Recovery Workbench API that belong to rwb-debtsale (Debt sale, module S6, service wave 3)
    under Microservice Ownership Map v1, split from Recovery Workbench API Specification v4 (4.0.0, 16 November
    2026) by the D-RCV-60 microservice realignment.
    This document holds 5 operations under REST base /api/recovery/debtsale/v1; schema rwb_debtsale; topic
    rwb.debtsale.events.v1; Temporal task queue rwb-debtsale in namespace rwb-recovery. The v4 text of every
    operation, parameter, schema, response, number and date is kept unchanged.
    Moved into this document from another module of v4: none.
    Moved out of this document to another service: none.
    The v4 document description, the tag list and the document map are kept in index.yaml; the event contract of
    the service is in asyncapi/rwb-debtsale.asyncapi.yaml.
servers:
- url: "/api/recovery/debtsale/v1"
  description: "Relative to the rwb-debtsale service in each environment"
security:
- entraId: []
tags:
- name: "Debt sale"
- name: "Partner portal"
x-service:
  code: "S6"
  service: "rwb-debtsale"
  name: "Debt sale"
  wave: 3
  schema: "rwb_debtsale"
  rest-base: "/api/recovery/debtsale/v1"
  topic: "rwb.debtsale.events.v1"
  task-queue: "rwb-debtsale"
  namespace: "rwb-recovery"
  asyncapi: "asyncapi/rwb-debtsale.asyncapi.yaml"
  operations: 5
paths:
  /debt-sale-lots:
    post:
      tags:
      - Debt sale
      summary: Create a lot from eligible accounts
      operationId: postDebtSaleLots
      x-module: S6
      x-owner: "S6"
      x-capability:
        area: Debt sale
        right: C
      x-first-release: E5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotRequest'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtSaleLot'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /debt-sale-lots/{lotId}:
    get:
      tags:
      - Debt sale
      summary: Read a lot with its accounts, reserve and bids
      operationId: getDebtSaleLotsLotid
      x-module: S6
      x-owner: "S6"
      x-capability:
        area: Debt sale
        right: R
      x-first-release: E5
      parameters:
      - name: lotId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtSaleLot'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /debt-sale-lots/{lotId}/award:
    post:
      tags:
      - Debt sale
      summary: Award a lot to a buyer after the bids close
      operationId: postDebtSaleLotsLotidAward
      x-module: S6
      x-owner: "S6"
      x-capability:
        area: Debt sale
        right: A
      x-first-release: E6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwardRequest'
      parameters:
      - name: lotId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionLogEntry'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /partner/data-room/{lotId}:
    get:
      tags:
      - Partner portal
      summary: Read the lot tape and documents for an admitted buyer
      operationId: getPartnerDataRoomLotid
      x-module: S6
      x-owner: "S6"
      x-capability:
        area: Partner portal
        right: R
      x-first-release: E5
      parameters:
      - name: lotId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataRoom'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /partner/data-room/{lotId}/bids:
    post:
      tags:
      - Partner portal
      summary: Submit a bid on a lot
      operationId: postPartnerDataRoomLotidBids
      x-module: S6
      x-owner: "S6"
      x-capability:
        area: Partner portal
        right: C
      x-first-release: E5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidRequest'
      parameters:
      - name: lotId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bid'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
components:
  securitySchemes:
    entraId:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration
  responses:
    E401:
      description: Unauthorized. No valid session, or the person holds no Workbench role. Messages MSG-P4-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Forbidden. The role lacks the right in the capability area. Messages MSG-P4-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found. The record does not exist or is outside the caller's scope. Messages MSG-P4-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflict. The state does not allow the action, the record changed, the approver is above the limit or prepared the decision.
        Messages MSG-P3-005, MSG-GEN-004, MSG-P7-001, MSG-P7-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: Unprocessable. A field fails validation. Messages MSG-GEN-001, MSG-GEN-002, MSG-GEN-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E503:
      description: Service unavailable. The decision could not be recorded, or a system of record is down. Messages MSG-P7-003, MSG-GEN-006
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    DecisionLogEntry:
      type: object
      description: One record per decision. Append only and hash chained.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the decision log entry
          readOnly: true
        caseId:
          type: string
          format: uuid
          description: The recovery_case this record belongs to; empty only for access events (decision code AC-...) with no case
        decisionCode:
          type: string
          maxLength: 8
          description: D5.1 to D9.3, X1 to X7, or an access event
        ruleId:
          type: string
          maxLength: 20
          description: Rule that fired
        ruleVersion:
          type: string
          maxLength: 20
          description: Rule version
        modelVersion:
          type: string
          maxLength: 40
          description: Model version used
        agentVersion:
          type: string
          maxLength: 40
          description: Agent and prompt version used
        inputsRef:
          type: string
          maxLength: 400
          description: Reference to the inputs snapshot, with the freshness of each input
        recommendation:
          type: object
          description: Option, reasons, confidence and alternatives
        approverUserId:
          type: string
          format: uuid
          description: Who approved
        approvalLevel:
          type: string
          maxLength: 4
          enum:
          - L1
          - L2
          - L3
          - L4
          - L5
          - L6
          description: Approval level applied
        finalCall:
          type: string
          maxLength: 40
          description: The option decided
        overrideReason:
          type: string
          maxLength: 1000
          description: Reason when the person did not follow the recommendation
        actions:
          type: object
          description: Target system, result and timestamps of each action
        outcome:
          type: object
          description: Cash, cure, loss and time, written when known
        decidedAt:
          type: string
          format: date-time
          description: When decided
        prevHash:
          type: string
          maxLength: 64
          description: Hash of the previous entry
        entryHash:
          type: string
          maxLength: 64
          description: Hash of this entry
        chainSeq:
          type: string
          description: Position of the entry in the hash chain; prev_hash is the entry_hash of chain_seq minus 1; unique on its own
        correctsEntryId:
          type: string
          format: uuid
          description: The entry this entry corrects
        actorUserId:
          type: string
          format: uuid
          description: The person or service identity whose action, preparation or access the entry records
        idempotencyKey:
          type: string
          maxLength: 80
          description: Event ID of the calling module; a repeat returns the first entry; unique on its own
      required:
      - id
      - decisionCode
      - inputsRef
      - finalCall
      - decidedAt
      - prevHash
      - entryHash
      - chainSeq
    DebtSaleLot:
      type: object
      description: A lot of accounts offered to debt buyers.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the debt sale lot
          readOnly: true
        lotNo:
          type: string
          maxLength: 15
          description: Lot number, for example 1/2024
        cutOffDate:
          type: string
          format: date
          description: Balance cut-off date
        segment:
          type: string
          maxLength: 20
          enum:
          - RETAIL
          - SSME
          - CORPORATE
          description: Segment of the lot
        reservePrice:
          type: number
          description: Reserve price, baht
        buyerPartnerId:
          type: string
          format: uuid
          description: Winning buyer
        buyerClass:
          type: string
          maxLength: 10
          enum:
          - AMC
          - NON_AMC
          description: AMC or non-AMC
        signingDate:
          type: string
          format: date
          description: Date the sale was signed
        approvalAuthority:
          type: string
          maxLength: 60
          description: Authority that approved the sale
        paymentTerms:
          type: string
          maxLength: 400
          description: Deposit and payment terms
        status:
          type: string
          maxLength: 12
          enum:
          - BUILDING
          - OFFERED
          - AWARDED
          - TRANSFERRED
          - CLOSED
          description: Building, offered, awarded, transferred, closed
      required:
      - id
      - lotNo
      - cutOffDate
      - segment
      - status
    LotRequest:
      type: object
      properties:
        name:
          type: string
        accountKeys:
          type: array
          items:
            type: string
            maxLength: 255
          description: ACE account_key values (v_ace_account)
        reservePrice:
          type: number
    AwardRequest:
      type: object
      properties:
        buyerId:
          type: string
          format: uuid
        price:
          type: number
    BidRequest:
      type: object
      properties:
        price:
          type: number
        terms:
          type: string
    DataRoom:
      type: object
      properties:
        lotId:
          type: string
          format: uuid
        tape:
          type: string
        documents:
          type: array
          items:
            type: string
        closesAt:
          type: string
    Bid:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lotId:
          type: string
          format: uuid
        price:
          type: number
        submittedAt:
          type: string
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        messageCode:
          type: string
        messageTh:
          type: string
        field:
          type: string
        traceId:
          type: string

asyncapi: 3.0.0
info:
  title: "Recovery Workbench events - rwb-payment"
  version: 5.0.0
  description: >-
    AsyncAPI 3.0 contract for the business-event topic of rwb-payment (Payment, module P8). One document per
    service, as Arch v5 slide 42 notes require; the document set is version 5.0.0 of 22 November 2026 (D-RCV-60
    microservice realignment).
    Producer and consumer names are those of the Arch v5 event catalogue, slides 42 and 43; payload field names
    are those of Event and Messaging Design v4 (sheet Events, payload column). Property types, required flags
    and formats are not specified in the source documents (GAP-0096; ASM-0160).
    Events carry IDs and facts, never personal data (Arch v5 slide 42 notes).
x-topic:
  name: "rwb.payment.events.v1"
  partitions: 12
  replication-factor: 3
  retention: "7 days"
  key: "caseId"
  mode: "CloudEvents 1.0 Kafka binding, binary mode (ce_* headers)"
  retry: "retry topics 1 min, 10 min, 1 h, then .dlt with alert"
  schema-registry: "JSON Schema registry, BACKWARD compatibility"
  fallback: "Event Hubs Premium"
  source: "Arch v5 slide 35 (Kafka line) and slide 42 notes"
  dead-letter: "rwb.payment.events.v1.dlt"
  dead-letter-note: "Top-level name derived by appending .dlt to the service topic (Template and Rules R4)"
defaultContentType: "application/cloudevents+json"
channels:
  "rwb.payment.events.v1":
    address: "rwb.payment.events.v1"
    title: "rwb.payment.events.v1"
    messages:
      TreatmentBooked:
        $ref: '#/components/messages/TreatmentBooked'
      PaymentMissed:
        $ref: '#/components/messages/PaymentMissed'
      ProceedsMatched:
        $ref: '#/components/messages/ProceedsMatched'
operations:
  publishTreatmentBooked:
    action: send
    channel:
      $ref: '#/channels/rwb.payment.events.v1'
    summary: "Publish TreatmentBooked (EV-11) to rwb.payment.events.v1"
    messages:
    - $ref: '#/channels/rwb.payment.events.v1/messages/TreatmentBooked'
  publishPaymentMissed:
    action: send
    channel:
      $ref: '#/channels/rwb.payment.events.v1'
    summary: "Publish PaymentMissed (EV-12) to rwb.payment.events.v1"
    messages:
    - $ref: '#/channels/rwb.payment.events.v1/messages/PaymentMissed'
  publishProceedsMatched:
    action: send
    channel:
      $ref: '#/channels/rwb.payment.events.v1'
    summary: "Publish ProceedsMatched (EV-25) to rwb.payment.events.v1"
    messages:
    - $ref: '#/channels/rwb.payment.events.v1/messages/ProceedsMatched'
x-shared-topics:
- name: "rwb.decision-record.v1"
  asyncapi: "asyncapi/rwb.decision-record.v1.asyncapi.yaml"
  note: "Every service publishes DecisionRecorded (DP-03); the shared contract sits in one document"
components:
  messages:
    TreatmentBooked:
      name: "rwb.payment.TreatmentBooked.v1"
      title: "TreatmentBooked"
      summary: "EV-11 TreatmentBooked"
      description: "Produced by rwb-payment; consumers: rwb-case, rwb-treatment"
      x-consumers: ["rwb-case", "rwb-treatment"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/TreatmentBookedEvent'
    PaymentMissed:
      name: "rwb.payment.PaymentMissed.v1"
      title: "PaymentMissed"
      summary: "EV-12 PaymentMissed"
      description: "Produced by rwb-payment; consumers: rwb-case, rwb-treatment, rwb-comms"
      x-consumers: ["rwb-case", "rwb-treatment", "rwb-comms"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/PaymentMissedEvent'
    ProceedsMatched:
      name: "rwb.payment.ProceedsMatched.v1"
      title: "ProceedsMatched"
      summary: "EV-25 ProceedsMatched"
      description: "Produced by rwb-payment; consumers: rwb-case, rwb-asset, rwb-debtsale, rwb-writeoff, rwb-guarantee"
      x-consumers: ["rwb-case", "rwb-asset", "rwb-debtsale", "rwb-writeoff", "rwb-guarantee"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/ProceedsMatchedEvent'
  schemas:
    CloudEventsHeaders:
      type: object
      description: "CloudEvents 1.0 Kafka binding in binary mode; ce_* headers (Arch v5 slide 35)"
      properties:
        ce_specversion:
          type: string
        ce_id:
          type: string
          description: "Event ID; also the idempotency key (Event and Messaging Design v4, sheet Rules)"
        ce_source:
          type: string
        ce_type:
          type: string
        ce_time:
          type: string
          format: date-time
        ce_subject:
          type: string
          description: "Kafka key: caseId (Arch v5 slide 35)"
        ce_datacontenttype:
          type: string
    TreatmentBookedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.payment.TreatmentBooked.v1"
          data:
            type: object
            description: "EV-11 TreatmentBooked payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              treatmentId: {}
              bookingRef: {}
              businessDate: {}
    PaymentMissedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.payment.PaymentMissed.v1"
          data:
            type: object
            description: "EV-12 PaymentMissed payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              treatmentId: {}
              dueDate: {}
              amountDue: {}
    ProceedsMatchedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.payment.ProceedsMatched.v1"
          data:
            type: object
            description: "EV-25 ProceedsMatched payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              proceedsId: {}
              caseId: {}
              amount: {}
    CloudEventEnvelope:
      type: object
      description: "CloudEvents 1.0 envelope (specversion, id, source, type, time, subject, data); Kafka binary mode carries the attributes in ce_* headers (Arch v5 slide 35)"
      required: [specversion, id, source, type, time, subject, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
        source:
          type: string
        type:
          type: string
        time:
          type: string
          format: date-time
        subject:
          type: string
        datacontenttype:
          type: string
        data:
          type: object

# Change log
# 5.0.0, 22 November 2026, D-RCV-60 microservice realignment, T3 Code / OpenCode / DeepSeek v4.1 Flash

asyncapi: 3.0.0
info:
  title: "Recovery Workbench events - rwb-comms"
  version: 5.0.0
  description: >-
    AsyncAPI 3.0 contract for the business-event topic of rwb-comms (Communications, module P6). One document
    per service, as Arch v5 slide 42 notes require; the document set is version 5.0.0 of 22 November 2026
    (D-RCV-60 microservice realignment).
    Producer and consumer names are those of the Arch v5 event catalogue, slides 42 and 43; payload field names
    are those of Event and Messaging Design v4 (sheet Events, payload column). Property types, required flags
    and formats are not specified in the source documents (GAP-0096; ASM-0160).
    Events carry IDs and facts, never personal data (Arch v5 slide 42 notes).
x-topic:
  name: "rwb.comms.events.v1"
  partitions: 12
  replication-factor: 3
  retention: "7 days"
  key: "caseId"
  mode: "CloudEvents 1.0 Kafka binding, binary mode (ce_* headers)"
  retry: "retry topics 1 min, 10 min, 1 h, then .dlt with alert"
  schema-registry: "JSON Schema registry, BACKWARD compatibility"
  fallback: "Event Hubs Premium"
  source: "Arch v5 slide 35 (Kafka line) and slide 42 notes"
  dead-letter: "rwb.comms.events.v1.dlt"
  dead-letter-note: "Top-level name derived by appending .dlt to the service topic (Template and Rules R4)"
defaultContentType: "application/cloudevents+json"
channels:
  "rwb.comms.events.v1":
    address: "rwb.comms.events.v1"
    title: "rwb.comms.events.v1"
    messages:
      NoticeGenerated:
        $ref: '#/components/messages/NoticeGenerated'
      NoticeDispatched:
        $ref: '#/components/messages/NoticeDispatched'
      NoticeDelivered:
        $ref: '#/components/messages/NoticeDelivered'
operations:
  publishNoticeGenerated:
    action: send
    channel:
      $ref: '#/channels/rwb.comms.events.v1'
    summary: "Publish NoticeGenerated (EV-13) to rwb.comms.events.v1"
    messages:
    - $ref: '#/channels/rwb.comms.events.v1/messages/NoticeGenerated'
  publishNoticeDispatched:
    action: send
    channel:
      $ref: '#/channels/rwb.comms.events.v1'
    summary: "Publish NoticeDispatched (EV-14) to rwb.comms.events.v1"
    messages:
    - $ref: '#/channels/rwb.comms.events.v1/messages/NoticeDispatched'
  publishNoticeDelivered:
    action: send
    channel:
      $ref: '#/channels/rwb.comms.events.v1'
    summary: "Publish NoticeDelivered (EV-15) to rwb.comms.events.v1"
    messages:
    - $ref: '#/channels/rwb.comms.events.v1/messages/NoticeDelivered'
x-shared-topics:
- name: "rwb.decision-record.v1"
  asyncapi: "asyncapi/rwb.decision-record.v1.asyncapi.yaml"
  note: "Every service publishes DecisionRecorded (DP-03); the shared contract sits in one document"
components:
  messages:
    NoticeGenerated:
      name: "rwb.comms.NoticeGenerated.v1"
      title: "NoticeGenerated"
      summary: "EV-13 NoticeGenerated"
      description: "Produced by rwb-comms; consumers: rwb-decision"
      x-consumers: ["rwb-decision"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/NoticeGeneratedEvent'
    NoticeDispatched:
      name: "rwb.comms.NoticeDispatched.v1"
      title: "NoticeDispatched"
      summary: "EV-14 NoticeDispatched"
      description: "Produced by rwb-comms; consumers: rwb-reporting"
      x-consumers: ["rwb-reporting"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/NoticeDispatchedEvent'
    NoticeDelivered:
      name: "rwb.comms.NoticeDelivered.v1"
      title: "NoticeDelivered"
      summary: "EV-15 NoticeDelivered"
      description: "Produced by rwb-comms; consumers: rwb-litigation, rwb-guarantee, rwb-case"
      x-consumers: ["rwb-litigation", "rwb-guarantee", "rwb-case"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/NoticeDeliveredEvent'
  schemas:
    CloudEventsHeaders:
      type: object
      description: "CloudEvents 1.0 Kafka binding in binary mode; ce_* headers (Arch v5 slide 35)"
      properties:
        ce_specversion:
          type: string
        ce_id:
          type: string
          description: "Event ID; also the idempotency key (Event and Messaging Design v4, sheet Rules)"
        ce_source:
          type: string
        ce_type:
          type: string
        ce_time:
          type: string
          format: date-time
        ce_subject:
          type: string
          description: "Kafka key: caseId (Arch v5 slide 35)"
        ce_datacontenttype:
          type: string
    NoticeGeneratedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.comms.NoticeGenerated.v1"
          data:
            type: object
            description: "EV-13 NoticeGenerated payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              noticeId: {}
              caseId: {}
              type: {}
              templateVersion: {}
              templateId: {}
              noticeType: {}
              generatedAt: {}
    NoticeDispatchedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.comms.NoticeDispatched.v1"
          data:
            type: object
            description: "EV-14 NoticeDispatched payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              noticeId: {}
              barcode: {}
              sentDate: {}
    NoticeDeliveredEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.comms.NoticeDelivered.v1"
          data:
            type: object
            description: "EV-15 NoticeDelivered payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              noticeId: {}
              deliveredAt: {}
              status: {}
    CloudEventEnvelope:
      type: object
      description: "CloudEvents 1.0 envelope (specversion, id, source, type, time, subject, data); Kafka binary mode carries the attributes in ce_* headers (Arch v5 slide 35)"
      required: [specversion, id, source, type, time, subject, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
        source:
          type: string
        type:
          type: string
        time:
          type: string
          format: date-time
        subject:
          type: string
        datacontenttype:
          type: string
        data:
          type: object

asyncapi: 3.0.0
info:
  title: "Recovery Workbench events - rwb-case"
  version: 5.0.0
  description: >-
    AsyncAPI 3.0 contract for the business-event topic of rwb-case (Case and workflow, module P3). One document
    per service, as Arch v5 slide 42 notes require; the document set is version 5.0.0 of 22 November 2026
    (D-RCV-60 microservice realignment).
    Producer and consumer names are those of the Arch v5 event catalogue, slides 42 and 43; payload field names
    are those of Event and Messaging Design v4 (sheet Events, payload column). Property types, required flags
    and formats are not specified in the source documents (GAP-0096; ASM-0160).
    Events carry IDs and facts, never personal data (Arch v5 slide 42 notes).
x-topic:
  name: "rwb.case.events.v1"
  partitions: 12
  replication-factor: 3
  retention: "7 days"
  key: "caseId"
  mode: "CloudEvents 1.0 Kafka binding, binary mode (ce_* headers)"
  retry: "retry topics 1 min, 10 min, 1 h, then .dlt with alert"
  schema-registry: "JSON Schema registry, BACKWARD compatibility"
  fallback: "Event Hubs Premium"
  source: "Arch v5 slide 35 (Kafka line) and slide 42 notes"
  dead-letter: "rwb.case.events.v1.dlt"
  dead-letter-note: "Top-level name derived by appending .dlt to the service topic (Template and Rules R4)"
defaultContentType: "application/cloudevents+json"
channels:
  "rwb.case.events.v1":
    address: "rwb.case.events.v1"
    title: "rwb.case.events.v1"
    messages:
      CaseCreated:
        $ref: '#/components/messages/CaseCreated'
      CaseAllocated:
        $ref: '#/components/messages/CaseAllocated'
      CaseAllocationFailed:
        $ref: '#/components/messages/CaseAllocationFailed'
      CaseTransferred:
        $ref: '#/components/messages/CaseTransferred'
      CaseStateChanged:
        $ref: '#/components/messages/CaseStateChanged'
      TimerBreached:
        $ref: '#/components/messages/TimerBreached'
operations:
  publishCaseCreated:
    action: send
    channel:
      $ref: '#/channels/rwb.case.events.v1'
    summary: "Publish CaseCreated (EV-01) to rwb.case.events.v1"
    messages:
    - $ref: '#/channels/rwb.case.events.v1/messages/CaseCreated'
  publishCaseAllocated:
    action: send
    channel:
      $ref: '#/channels/rwb.case.events.v1'
    summary: "Publish CaseAllocated (EV-02) to rwb.case.events.v1"
    messages:
    - $ref: '#/channels/rwb.case.events.v1/messages/CaseAllocated'
  publishCaseAllocationFailed:
    action: send
    channel:
      $ref: '#/channels/rwb.case.events.v1'
    summary: "Publish CaseAllocationFailed (EV-03) to rwb.case.events.v1"
    messages:
    - $ref: '#/channels/rwb.case.events.v1/messages/CaseAllocationFailed'
  publishCaseTransferred:
    action: send
    channel:
      $ref: '#/channels/rwb.case.events.v1'
    summary: "Publish CaseTransferred (EV-04) to rwb.case.events.v1"
    messages:
    - $ref: '#/channels/rwb.case.events.v1/messages/CaseTransferred'
  publishCaseStateChanged:
    action: send
    channel:
      $ref: '#/channels/rwb.case.events.v1'
    summary: "Publish CaseStateChanged (EV-05) to rwb.case.events.v1"
    messages:
    - $ref: '#/channels/rwb.case.events.v1/messages/CaseStateChanged'
  publishTimerBreached:
    action: send
    channel:
      $ref: '#/channels/rwb.case.events.v1'
    summary: "Publish TimerBreached (EV-19) to rwb.case.events.v1"
    messages:
    - $ref: '#/channels/rwb.case.events.v1/messages/TimerBreached'
x-shared-topics:
- name: "rwb.decision-record.v1"
  asyncapi: "asyncapi/rwb.decision-record.v1.asyncapi.yaml"
  note: "Every service publishes DecisionRecorded (DP-03); the shared contract sits in one document"
components:
  messages:
    CaseCreated:
      name: "rwb.case.CaseCreated.v1"
      title: "CaseCreated"
      summary: "EV-01 CaseCreated"
      description: "Produced by rwb-case; consumers: rwb-agent, rwb-deviation, rwb-reporting"
      x-consumers: ["rwb-agent", "rwb-deviation", "rwb-reporting"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/CaseCreatedEvent'
    CaseAllocated:
      name: "rwb.case.CaseAllocated.v1"
      title: "CaseAllocated"
      summary: "EV-02 CaseAllocated"
      description: "Produced by rwb-case; consumers: rwb-reporting"
      x-consumers: ["rwb-reporting"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/CaseAllocatedEvent'
    CaseAllocationFailed:
      name: "rwb.case.CaseAllocationFailed.v1"
      title: "CaseAllocationFailed"
      summary: "EV-03 CaseAllocationFailed"
      description: "Produced by rwb-case; consumers: rwb-case"
      x-consumers: ["rwb-case"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/CaseAllocationFailedEvent'
    CaseTransferred:
      name: "rwb.case.CaseTransferred.v1"
      title: "CaseTransferred"
      summary: "EV-04 CaseTransferred"
      description: "Produced by rwb-case; consumers: rwb-reporting"
      x-consumers: ["rwb-reporting"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/CaseTransferredEvent'
    CaseStateChanged:
      name: "rwb.case.CaseStateChanged.v1"
      title: "CaseStateChanged"
      summary: "EV-05 CaseStateChanged"
      description: "Produced by rwb-case; consumers: rwb-comms, rwb-reporting"
      x-consumers: ["rwb-comms", "rwb-reporting"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/CaseStateChangedEvent'
    TimerBreached:
      name: "rwb.case.TimerBreached.v1"
      title: "TimerBreached"
      summary: "EV-19 TimerBreached"
      description: "Produced by rwb-case; consumers: gateway-bff (inbox)"
      x-consumers: ["gateway-bff (inbox)"]
      contentType: "application/cloudevents+json"
      headers:
        $ref: '#/components/schemas/CloudEventsHeaders'
      payload:
        $ref: '#/components/schemas/TimerBreachedEvent'
  schemas:
    CloudEventsHeaders:
      type: object
      description: "CloudEvents 1.0 Kafka binding in binary mode; ce_* headers (Arch v5 slide 35). Occurred-time attribute name: Not specified in the source documents (GAP-1056). Legacy key shape for the four events and relay publish limit (platform parameter): Not specified in the source documents (GAP-2257). Registry subject derived from rwb.case.events.v1 (GAP-2257)."
      properties:
        ce_specversion:
          type: string
        ce_id:
          type: string
          description: "Event ID; also the idempotency key (Event and Messaging Design v4, sheet Rules)"
        ce_source:
          type: string
        ce_type:
          type: string
        ce_time:
          type: string
          format: date-time
        ce_subject:
          type: string
          description: "Kafka key: caseId (Arch v5 slide 35)"
        ce_idempotencykey:
          type: string
        ce_actor:
          type: string
        ce_datacontenttype:
          type: string
    CaseCreatedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.case.CaseCreated.v1"
          data:
            type: object
            description: "EV-01 CaseCreated payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              caseId: {}
              caseNo: {}
              productGroup: {}
              accounts: {}
              businessDate: {}
    CaseAllocatedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.case.CaseAllocated.v1"
          data:
            type: object
            description: "EV-02 CaseAllocated payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              caseId: {}
              queueId: {}
              ownerId: {}
              ruleId: {}
              ruleVersion: {}
    CaseAllocationFailedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.case.CaseAllocationFailed.v1"
          data:
            type: object
            description: "EV-03 CaseAllocationFailed payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              caseId: {}
              reason: {}
              ruleGap: {}
    CaseTransferredEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.case.CaseTransferred.v1"
          data:
            type: object
            description: "EV-04 CaseTransferred payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              caseId: {}
              fromOwner: {}
              toOwner: {}
              reasonCode: {}
    CaseStateChangedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.case.CaseStateChanged.v1"
          data:
            type: object
            description: "EV-05 CaseStateChanged payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              caseId: {}
              fromState: {}
              toState: {}
              ruleId: {}
              decisionLogEntryId: {}
    TimerBreachedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          type:
            const: "rwb.case.TimerBreached.v1"
          data:
            type: object
            description: "EV-19 TimerBreached payload; field names from Event and Messaging Design v4 (sheet Events); property types, required flags and formats are not specified in the source documents (GAP-0096; ASM-0160)"
            properties:
              timerId: {}
              caseId: {}
              escalateTo: {}
    CloudEventEnvelope:
      type: object
      description: "CloudEvents 1.0 envelope (specversion, id, source, type, time, subject, data); Kafka binary mode carries the attributes in ce_* headers (Arch v5 slide 35)"
      required: [specversion, id, source, type, time, subject, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
        source:
          type: string
        type:
          type: string
        time:
          type: string
          format: date-time
        subject:
          type: string
        datacontenttype:
          type: string
        data:
          type: object

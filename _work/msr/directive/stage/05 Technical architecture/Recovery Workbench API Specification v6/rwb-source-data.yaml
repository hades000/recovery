# 5.0.0, 22 November 2026, D-RCV-60 microservice realignment, T3 Code / OpenCode / DeepSeek v4.1 Flash

openapi: 3.1.0
info:
  title: "Recovery Workbench API - rwb-source-data (Source data)"
  version: 5.0.0
  description: >-
    Operations of the Recovery Workbench API that belong to rwb-source-data (Source data, module P1, service
    wave 1) under Microservice Ownership Map v1, split from Recovery Workbench API Specification v4 (4.0.0, 16
    November 2026) by the D-RCV-60 microservice realignment.
    This document holds 12 operations under REST base /api/recovery/source-data/v1; schema rwb_source_data;
    topic rwb.source-data.events.v1; Temporal task queue rwb-source-data in namespace rwb-recovery. The v4 text
    of every operation, parameter, schema, response, number and date is kept unchanged.
    Moved into this document from another module of v4: GET /cases/{caseId}/interactions (x-module P3, owner
    P1); POST /cases/{caseId}/interactions (x-module P3, owner P1).
    Moved out of this document to another service: none.
    The v4 document description, the tag list and the document map are kept in index.yaml; the event contract of
    the service is in asyncapi/rwb-source-data.asyncapi.yaml.
servers:
- url: "/api/recovery/source-data/v1"
  description: "Relative to the rwb-source-data service in each environment"
security:
- entraId: []
tags:
- name: "Cases"
- name: "Interactions"
- name: "Administration"
x-service:
  code: "P1"
  service: "rwb-source-data"
  name: "Source data"
  wave: 1
  schema: "rwb_source_data"
  rest-base: "/api/recovery/source-data/v1"
  topic: "rwb.source-data.events.v1"
  task-queue: "rwb-source-data"
  namespace: "rwb-recovery"
  asyncapi: "asyncapi/rwb-source-data.asyncapi.yaml"
  operations: 12
paths:
  /cases/{caseId}/interactions:
    get:
      tags:
      - Interactions
      summary: Read the interaction ledger for a case
      operationId: getCasesCaseidInteractions
      x-module: P3
      x-owner: "P1"
      x-owner-note: "API Specification v4 x-module P3; owner P1 per Microservice Ownership Map v1 (sheet Endpoints) and ASM-0038"
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: channel
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      description: Add query parameter actor. Interaction adds eventCode (string), caseSeq (integer), actorType (string), actorRef (string), sourceRef
        (string) and decisionLogEntryId (uuid); summary masked by role. Errors add 422 (MSG-GEN-001, MSG-GEN-002, MSG-GEN-003); 503 when the access
        event cannot be written (MSG-P7-003). Interaction adds the channel ledger fields contactKey (string, composite contact_type:key from v_ace_contact),
        fromHolderRef (string), toHolderRef (string), treatmentId (uuid), proceedsId (uuid) and retentionClass (string). An empty ledger returns
        an empty page with MSG-P3-024.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionPage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
    post:
      tags:
      - Interactions
      summary: Record a contact, promise or hand-over
      operationId: postCasesCaseidInteractions
      x-module: P3
      x-owner: "P1"
      x-owner-note: "API Specification v4 x-module P3; owner P1 per Microservice Ownership Map v1 (sheet Endpoints) and ASM-0038"
      x-capability:
        area: Case record
        right: C
      x-first-release: E1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionRequest'
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: Schema Interaction adds deliveryStatus (string) and externalRef (string), returned by POST /cases/{caseId}/messages and in
        the ledger.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /admin/jobs:
    get:
      tags:
      - Administration
      summary: List Workbench jobs and outbound files with status
      operationId: getAdminJobs
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Platform administration
        right: R
      x-first-release: E1
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      description: 'D-RCV-35: lists Workbench-owned jobs only (case intake from the ACE batch, outbound files, timers, measures, reconciliation,
        retention). Source loads are not Workbench jobs: ACE ingestion runs them and their completion is read from recovery.v_ace_batch_status
        (ace_batch_run). The type filter takes a job_catalog job ID.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /admin/jobs/{jobId}/rerun:
    post:
      tags:
      - Administration
      summary: Rerun a failed Workbench job
      operationId: postAdminJobsJobidRerun
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Platform administration
        right: U
      x-first-release: E1
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: 'D-RCV-35: reruns a failed Workbench job from the job catalog, for example case intake for a business date or an outbound file.
        There is no source load rerun: a late or failed source batch is rerun by ACE ingestion, and the Workbench picks it up from ace_batch_run.
        A job that is not in the Workbench job catalog returns 404.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
  /data-products/freshness:
    get:
      tags:
      - Cases
      summary: Read the freshness stamp of each data product from the ACE batch business date
      operationId: getDataProductsFreshness
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: product
        in: query
        required: false
        schema:
          type: string
      - name: asOf
        in: query
        required: false
        schema:
          type: string
      description: 'D-RCV-35: the stamp is data_product_load, written from recovery.v_ace_batch_status over ACE ace_batch_run (RWB-ACE-001). The
        Workbench loads nothing: businessDate is the ACE business date of the last completed source batch, sourceExtractedAt its completion time,
        loadedAt when the Workbench recorded the stamp. A product is stale when no completed batch exists for the expected business date (RWB-E1-015).'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataProductFreshness'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /data-products/{productCode}/records:
    get:
      tags:
      - Cases
      summary: Read the rows of one data product for a case through the ACE views, masked by role, with its freshness stamp
      operationId: getDataProductsProductcodeRecords
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Case record
        right: R
      x-first-release: E1
      parameters:
      - name: productCode
        in: path
        required: true
        schema:
          type: string
      - name: caseId
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      description: 'D-RCV-35: source rows are read live through the recovery.v_ace_* views (for example v_ace_account, v_ace_payment, v_ace_customer,
        v_ace_contact, v_ace_collateral), filtered by the case''s account_key and person_key values; Workbench rows come from the recovery tables
        and the extension tables. Nothing is copied. Masking is applied by role (RWB-E1-037) and every read is written to the access log.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProductRecordPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
  /admin/data-products:
    get:
      tags:
      - Administration
      summary: List the data catalog entries
      operationId: getAdminDataProducts
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Platform administration
        right: R
      x-first-release: E1
      parameters:
      - name: product
        in: query
        required: false
        schema:
          type: string
      description: 'D-RCV-35: the catalog lists each data product with its read path. Source products name ACE as the system of record ("ACE (ingested
        from X)") and the v_ace_* views they read; Workbench products name the recovery tables.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataProductCatalogEntry'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /admin/data-dictionary/fields:
    get:
      tags:
      - Administration
      summary: Search the data dictionary
      operationId: getAdminDataDictionaryFields
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Reference data
        right: R
      x-first-release: E1
      parameters:
      - name: product
        in: query
        required: false
        schema:
          type: string
      - name: entity
        in: query
        required: false
        schema:
          type: string
      - name: field
        in: query
        required: false
        schema:
          type: string
      - name: sourceSystem
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
      description: 'D-RCV-35: reads v_data_dictionary over sys_objects and sys_fields: 122 objects (92 tables and 30 v_ace_* views) and 1,366
        fields. A view field carries sourceSystem ACE and sourceField the ACE column it maps (for example public.account.delay_days for days_past_due).
        The sourceSystem filter takes ACE or WORKBENCH.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDictionaryFieldPage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /admin/data-dictionary/fields/{fieldCode}:
    patch:
      tags:
      - Administration
      summary: Change a field definition with a reason, creating a new version
      operationId: patchAdminDataDictionaryFieldsFieldcode
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Reference data
        right: U
      x-first-release: E1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataDictionaryFieldChange'
      parameters:
      - name: fieldCode
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDictionaryField'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /admin/data-contracts:
    get:
      tags:
      - Administration
      summary: 'List data contracts: the ACE view contract and the outbound interfaces'
      operationId: getAdminDataContracts
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Reference data
        right: R
      x-first-release: E1
      parameters:
      - name: sourceSystem
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      description: 'D-RCV-35: there is no inbound load contract. The ACE contract is the v_ace_* view list and the RWB-ACE-001 field appendix,
        confirmed by the ACE team lead (DL43); the other contracts cover outbound interfaces only.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataContract'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /admin/data-contracts/{contractId}:
    patch:
      tags:
      - Administration
      summary: Record the system owner's confirmation of a data contract (the ACE team lead for the view contract)
      operationId: patchAdminDataContractsContractid
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Reference data
        right: U
      x-first-release: E1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataContractConfirmation'
      parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContract'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /admin/data-contracts/{contractId}/publish:
    post:
      tags:
      - Administration
      summary: Publish a confirmed data contract
      operationId: postAdminDataContractsContractidPublish
      x-module: P1
      x-owner: "P1"
      x-capability:
        area: Reference data
        right: U
      x-first-release: E1
      parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContract'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
components:
  securitySchemes:
    entraId:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration
  responses:
    E400:
      description: Bad request. The request is malformed. Messages MSG-GEN-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Unauthorized. No valid session, or the person holds no Workbench role. Messages MSG-P4-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Forbidden. The role lacks the right in the capability area. Messages MSG-P4-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found. The record does not exist or is outside the caller's scope. Messages MSG-P4-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflict. The state does not allow the action, the record changed, the approver is above the limit or prepared the decision.
        Messages MSG-P3-005, MSG-GEN-004, MSG-P7-001, MSG-P7-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: Unprocessable. A field fails validation. Messages MSG-GEN-001, MSG-GEN-002, MSG-GEN-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E503:
      description: Service unavailable. The decision could not be recorded, or a system of record is down. Messages MSG-P7-003, MSG-GEN-006
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Interaction:
      type: object
      description: 'One entry in the interaction ledger: a contact, letter, promise, payment or hand-over.'
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the interaction
          readOnly: true
        caseId:
          type: string
          format: uuid
          description: The recovery_case this record belongs to
        personKey:
          type: string
          maxLength: 255
          description: ACE person_key of the customer (v_ace_customer)
        occurredAt:
          type: string
          format: date-time
          description: When it happened
        channel:
          type: string
          maxLength: 15
          enum:
          - MOBILE
          - HOME_PHONE
          - WORK_PHONE
          - LINE
          - EMAIL
          - POSTAL_ADDRESS
          - CALL
          - VISIT
          - SMS
          - LETTER
          - PORTAL
          - BRANCH
          description: Call, visit, SMS, LINE, email, letter, portal, branch; empty for Workbench events such as CASE_CREATED
        direction:
          type: string
          maxLength: 8
          enum:
          - INBOUND
          - OUTBOUND
          description: Inbound or outbound; empty for Workbench events such as CASE_CREATED
        actionCode:
          type: string
          maxLength: 10
          description: Action code
        contactResult:
          type: string
          maxLength: 20
          enum:
          - RIGHT_PARTY
          - THIRD_PARTY
          - NO_ANSWER
          - WRONG_NUMBER
          - REFUSED
          description: Right party, third party, no answer, wrong number
        promiseAmount:
          type: number
          description: Amount promised, baht
        promiseDate:
          type: string
          format: date
          description: Date promised
        summary:
          type: string
          maxLength: 2000
          x-personal-data: true
          description: Summary of what was said. Masked unless the caller's role may see it
        conductCheck:
          type: string
          maxLength: 15
          enum:
          - PASSED
          - BLOCKED
          - NOT_APPLICABLE
          description: Passed, blocked, not applicable
        sourceSystem:
          type: string
          maxLength: 10
          enum:
          - EFS
          - WORKBENCH
          description: EFS for collections history read from ACE (v_ace_efs_action), or the Workbench
        eventCode:
          type: string
          maxLength: 40
          enum:
          - CONTACT
          - LETTER
          - PROMISE
          - PAYMENT
          - HANDOVER
          - CASE_CREATED
          - CASE_ALLOCATED
          - CASE_TRANSFERRED
          - CASE_ESCALATED
          - DOCUMENT_ATTACHED
          - DECISION_TAKEN
          - CORRECTION
          - PARTNER_RESULT
          - OFFER
          description: Ledger event
        actorType:
          type: string
          maxLength: 10
          enum:
          - USER
          - SERVICE
          - PARTNER
          description: User, service or partner
        actorRef:
          type: string
          maxLength: 64
          description: User ID or service identity code that acted
        sourceRef:
          type: string
          maxLength: 60
          description: Producing module and event, or the interface, for example EV-02 CaseAllocated or INT-07
        idempotencyKey:
          type: string
          maxLength: 120
          description: Unique key of the event or request; repeats are rejected; unique on its own
        caseSeq:
          type: string
          description: Gap-free sequence of the entry within its case; unique with case_id
        decisionLogId:
          type: string
          format: uuid
          description: Decision log entry the entry records, for DECISION_TAKEN
        correctsEntryId:
          type: string
          format: uuid
          description: Entry this entry corrects
        contactKey:
          type: string
          maxLength: 255
          description: The contact point reached, as the v_ace_contact composite key contact_type:key (PHONE, EMAIL or ADDRESS); the number or
            address is masked by role
        fromHolderRef:
          type: string
          maxLength: 60
          description: 'Who held the case before a hand-over: USER:<user id> or PARTNER:<partner code>'
        toHolderRef:
          type: string
          maxLength: 60
          description: 'Who holds the case after a hand-over: USER:<user id> or PARTNER:<partner code>'
        treatmentId:
          type: string
          format: uuid
          description: The treatment offered, for an OFFER entry
        proceedsId:
          type: string
          format: uuid
          description: The proceeds matched, for a PAYMENT entry
        retentionClass:
          type: string
          maxLength: 10
          description: Retention class of the entry, set by entry type
        deliveryStatus:
          type: string
          maxLength: 15
          enum:
          - SENT
          - DELIVERED
          - READ
          - FAILED
          description: Delivery state of an outbound SMS, LINE message or letter
        externalRef:
          type: string
          maxLength: 60
          description: Reference returned by NSS, LINE OA or WIN
      required:
      - id
      - caseId
      - occurredAt
      - sourceSystem
    InteractionRequest:
      type: object
      properties:
        channel:
          type: string
          enum:
          - MOBILE
          - HOME_PHONE
          - WORK_PHONE
          - LINE
          - EMAIL
          - POSTAL_ADDRESS
          - CALL
          - VISIT
          - SMS
          - LETTER
          - PORTAL
          - BRANCH
        direction:
          type: string
          enum:
          - INBOUND
          - OUTBOUND
        result:
          type: string
          enum:
          - RIGHT_PARTY
          - THIRD_PARTY
          - NO_ANSWER
          - WRONG_NUMBER
          - REFUSED
        summary:
          type: string
    Job:
      type: object
      properties:
        id:

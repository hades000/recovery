openapi: 3.1.0
info:
  title: "Recovery Workbench API - rwb-guarantee (Guarantee)"
  version: 5.0.0
  description: >-
    Operations of the Recovery Workbench API that belong to rwb-guarantee (Guarantee, module S3, service wave 3)
    under Microservice Ownership Map v1, split from Recovery Workbench API Specification v4 (4.0.0, 16 November
    2026) by the D-RCV-60 microservice realignment.
    This document holds 2 operations under REST base /api/recovery/guarantee/v1; schema rwb_guarantee; topic
    rwb.guarantee.events.v1; Temporal task queue rwb-guarantee in namespace rwb-recovery. The v4 text of every
    operation, parameter, schema, response, number and date is kept unchanged.
    Moved into this document from another module of v4: none.
    Moved out of this document to another service: none.
    The v4 document description, the tag list and the document map are kept in index.yaml; the event contract of
    the service is in asyncapi/rwb-guarantee.asyncapi.yaml.
servers:
- url: "/api/recovery/guarantee/v1"
  description: "Relative to the rwb-guarantee service in each environment"
security:
- entraId: []
tags:
- name: "Treatment"
x-service:
  code: "S3"
  service: "rwb-guarantee"
  name: "Guarantee"
  wave: 3
  schema: "rwb_guarantee"
  rest-base: "/api/recovery/guarantee/v1"
  topic: "rwb.guarantee.events.v1"
  task-queue: "rwb-guarantee"
  namespace: "rwb-recovery"
  asyncapi: "asyncapi/rwb-guarantee.asyncapi.yaml"
  operations: 2
paths:
  /cases/{caseId}/guarantee-claims:
    post:
      tags:
      - Treatment
      summary: Open a guarantee or TCG claim
      operationId: postCasesCaseidGuaranteeClaims
      x-module: S3
      x-owner: "S3"
      x-capability:
        area: Treatment and offer
        right: C
      x-first-release: E4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuaranteeClaimRequest'
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuaranteeClaim'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /guarantee-claims/{claimId}:
    patch:
      tags:
      - Treatment
      summary: Record the claim result
      operationId: patchGuaranteeClaimsClaimid
      x-module: S3
      x-owner: "S3"
      x-capability:
        area: Treatment and offer
        right: U
      x-first-release: E4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuaranteeClaimUpdate'
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuaranteeClaim'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
components:
  securitySchemes:
    entraId:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration
  responses:
    E401:
      description: Unauthorized. No valid session, or the person holds no Workbench role. Messages MSG-P4-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Forbidden. The role lacks the right in the capability area. Messages MSG-P4-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found. The record does not exist or is outside the caller's scope. Messages MSG-P4-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflict. The state does not allow the action, the record changed, the approver is above the limit or prepared the decision.
        Messages MSG-P3-005, MSG-GEN-004, MSG-P7-001, MSG-P7-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: Unprocessable. A field fails validation. Messages MSG-GEN-001, MSG-GEN-002, MSG-GEN-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E503:
      description: Service unavailable. The decision could not be recorded, or a system of record is down. Messages MSG-P7-003, MSG-GEN-006
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    GuaranteeClaim:
      type: object
      description: A claim against a Thai Credit Guarantee Corporation guarantee or an insurer.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the guarantee claim
          readOnly: true
        caseId:
          type: string
          format: uuid
          description: The recovery_case this record belongs to
        claimType:
          type: string
          maxLength: 25
          enum:
          - TCG
          - CREDIT_LIFE_INSURANCE
          - MORTGAGE_INSURANCE
          - COLLATERAL_INSURANCE
          description: TCG, credit life insurance, mortgage insurance, collateral insurance
        claimDeadline:
          type: string
          format: date
          description: Last date the claim can be filed
        claimedAmount:
          type: number
          description: Amount claimed, baht
        filedAt:
          type: string
          format: date
          description: Date filed
        paidAmount:
          type: number
          description: Amount paid, baht
        status:
          type: string
          maxLength: 12
          enum:
          - PREPARING
          - FILED
          - DEFECT
          - PAID
          - REJECTED
          description: Preparing, filed, defect, paid, rejected
      required:
      - id
      - caseId
      - claimType
      - claimDeadline
      - claimedAmount
      - status
    GuaranteeClaimRequest:
      type: object
      properties:
        claimType:
          type: string
          enum:
          - TCG
          - CREDIT_LIFE_INSURANCE
          - MORTGAGE_INSURANCE
          - COLLATERAL_INSURANCE
        guaranteeReference:
          type: string
    GuaranteeClaimUpdate:
      type: object
      properties:
        status:
          type: string
          enum:
          - PREPARING
          - FILED
          - DEFECT
          - PAID
          - REJECTED
        amountPaid:
          type: number
        paidOn:
          type: string
          format: date
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        messageCode:
          type: string
        messageTh:
          type: string
        field:
          type: string
        traceId:
          type: string

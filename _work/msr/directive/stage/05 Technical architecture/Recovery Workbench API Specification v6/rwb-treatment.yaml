openapi: 3.1.0
info:
  title: "Recovery Workbench API - rwb-treatment (Treatment and offer)"
  version: 5.0.0
  description: >-
    Operations of the Recovery Workbench API that belong to rwb-treatment (Treatment and offer, module S2,
    service wave 2) under Microservice Ownership Map v1, split from Recovery Workbench API Specification v4
    (4.0.0, 16 November 2026) by the D-RCV-60 microservice realignment.
    This document holds 4 operations under REST base /api/recovery/treatment/v1; schema rwb_treatment; topic
    rwb.treatment.events.v1; Temporal task queue rwb-treatment in namespace rwb-recovery. The v4 text of every
    operation, parameter, schema, response, number and date is kept unchanged.
    Moved into this document from another module of v4: none.
    Moved out of this document to another service: none.
    The v4 document description, the tag list and the document map are kept in index.yaml; the event contract of
    the service is in asyncapi/rwb-treatment.asyncapi.yaml.
servers:
- url: "/api/recovery/treatment/v1"
  description: "Relative to the rwb-treatment service in each environment"
security:
- entraId: []
tags:
- name: "Treatment"
x-service:
  code: "S2"
  service: "rwb-treatment"
  name: "Treatment and offer"
  wave: 2
  schema: "rwb_treatment"
  rest-base: "/api/recovery/treatment/v1"
  topic: "rwb.treatment.events.v1"
  task-queue: "rwb-treatment"
  namespace: "rwb-recovery"
  asyncapi: "asyncapi/rwb-treatment.asyncapi.yaml"
  operations: 4
paths:
  /cases/{caseId}/treatments:
    post:
      tags:
      - Treatment
      summary: Open a restructure, settlement or deed in lieu treatment
      operationId: postCasesCaseidTreatments
      x-module: S2
      x-owner: "S2"
      x-capability:
        area: Treatment and offer
        right: C
      x-first-release: E2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreatmentRequest'
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Treatment'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /treatments/{treatmentId}:
    get:
      tags:
      - Treatment
      summary: Read a treatment with its terms, status and booking
      operationId: getTreatmentsTreatmentid
      x-module: S2
      x-owner: "S2"
      x-capability:
        area: Treatment and offer
        right: R
      x-first-release: E2
      parameters:
      - name: treatmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Treatment'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
    patch:
      tags:
      - Treatment
      summary: Change the terms of a draft treatment
      operationId: patchTreatmentsTreatmentid
      x-module: S2
      x-owner: "S2"
      x-capability:
        area: Treatment and offer
        right: U
      x-first-release: E3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreatmentUpdate'
      parameters:
      - name: treatmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Treatment'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /treatments/{treatmentId}/submit:
    post:
      tags:
      - Treatment
      summary: Submit a treatment for approval
      operationId: postTreatmentsTreatmentidSubmit
      x-module: S2
      x-owner: "S2"
      x-capability:
        area: Treatment and offer
        right: U
      x-first-release: E3
      parameters:
      - name: treatmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
components:
  securitySchemes:
    entraId:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration
  responses:
    E401:
      description: Unauthorized. No valid session, or the person holds no Workbench role. Messages MSG-P4-001
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Forbidden. The role lacks the right in the capability area. Messages MSG-P4-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found. The record does not exist or is outside the caller's scope. Messages MSG-P4-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflict. The state does not allow the action, the record changed, the approver is above the limit or prepared the decision.
        Messages MSG-P3-005, MSG-GEN-004, MSG-P7-001, MSG-P7-002
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: Unprocessable. A field fails validation. Messages MSG-GEN-001, MSG-GEN-002, MSG-GEN-003
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E503:
      description: Service unavailable. The decision could not be recorded, or a system of record is down. Messages MSG-P7-003, MSG-GEN-006
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Treatment:
      type: object
      description: A resolution put to the customer or carried out on the case, with its terms and outcome.
      properties:
        id:
          type: string
          format: uuid
          description: Record identifier of the treatment
          readOnly: true
        caseId:
          type: string
          format: uuid
          description: The recovery_case this record belongs to
        decisionLogId:
          type: string
          format: uuid
          description: The decision that approved it
        treatmentType:
          type: string
          maxLength: 20
          enum:
          - RESTRUCTURE
          - SETTLEMENT
          - DEED_IN_LIEU
          - BUY_BACK
          - GUARANTEE_CLAIM
          - REPOSSESSION
          - AUCTION
          - DEBT_SALE
          - WRITE_OFF
          - RAMC_TRANSFER
          - RENTAL
          description: Restructure, settlement, deed in lieu, buy-back, guarantee claim, repossession, auction, debt sale, write-off, RAMC transfer,
            rental
        proposedBy:
          type: string
          maxLength: 10
          enum:
          - AGENT
          - RULE
          - PERSON
          description: Agent, rule, person
        proposedAt:
          type: string
          format: date-time
          description: When proposed
        offerAmount:
          type: number
          description: Amount offered or agreed, baht
        haircutAmount:
          type: number
          description: Amount forgiven, baht
        installments:
          type: integer
          description: Number of installments in a plan
        validUntil:
          type: string
          format: date
          description: Offer validity
        approvalLevel:
          type: string
          maxLength: 4
          enum:
          - L1
          - L2
          - L3
          - L4
          - L5
          - L6
          description: Approval level that approved it
        bookedAt:
          type: string
          format: date-time
          description: When booked in the core
        outcome:
          type: string
          maxLength: 12
          enum:
          - KEPT
          - BROKEN
          - COMPLETED
          - CANCELED
          - DECLINED
          description: Kept, broken, completed, canceled, declined
        outcomeAt:
          type: string
          format: date-time
          description: When the outcome was recorded
        nleadsRef:
          type: string
          maxLength: 30
          description: NLEADS reference of the credit approval, read from v_ace_credit_decision; read only
          readOnly: true
        creditResult:
          type: string
          maxLength: 10
          enum:
          - APPROVED
          - REFUSED
          description: Approved or refused, read from v_ace_credit_decision; read only
          readOnly: true
        creditResultReason:
          type: string
          maxLength: 1000
          description: Reason given by NLEADS, read from v_ace_credit_decision; read only
          readOnly: true
        creditResultAt:
          type: string
          format: date-time
          description: When NLEADS gave the decision, read from v_ace_credit_decision; read only
          readOnly: true
        interestRate:
          type: number
          description: Approved interest rate of the plan, percent
        bookingDifference:
          type: object
          description: 'Each term that differs between approval and booking: term, approved, booked, business date'
        firstDueDate:
          type: string
          format: date
          description: Date the first installment is due
        signatureStatus:
          type: string
          maxLength: 12
          enum:
          - PENDING
          - SIGNED
          - NOT_SIGNED
          description: Pending, signed or not signed, read by the routing rules
        installmentAmount:
          type: number
          description: Amount due per plan installment, baht
        installmentsPaid:
          type: integer
          description: Installments matched so far
        installmentShortfall:
          type: number
          description: Shortfall left on the plan by a partial payment, baht
      required:
      - id
      - caseId
      - treatmentType
      - proposedBy
      - proposedAt
      - installmentsPaid
    TreatmentRequest:
      type: object
      properties:
        treatmentType:
          type: string
          enum:
          - RESTRUCTURE
          - SETTLEMENT
          - DEED_IN_LIEU
          - BUY_BACK
          - GUARANTEE_CLAIM
          - REPOSSESSION
          - AUCTION
          - DEBT_SALE
          - WRITE_OFF
          - RAMC_TRANSFER
          - RENTAL
        accountKeys:
          type: array
          items: &id002
            type: string
            maxLength: 255
          description: ACE account_key values (v_ace_account)
        terms:
          type: object
    TreatmentUpdate:
      type: object
      properties:
        terms:
          type: object
        version:
          type: integer
    Approval:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        decision:
          type: string
        preparedBy:
          type: string
        level:
          type: string
        amount:
          type: number
        status:
          type: string
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        messageCode:
          type: string
        messageTh:
          type: string
        field:
          type: string
        traceId:
          type: string

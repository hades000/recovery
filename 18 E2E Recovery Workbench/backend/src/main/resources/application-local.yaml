# Local profile: the docker compose stack. Values that are secret even locally come from .env.
logging:
  structured:
    format:
      console: ""                    # readable console logs on a laptop
management:
  tracing:
    export:
      enabled: false
rwb:
  p3:
    temporal: ${RWB_P3_TEMPORAL:true}
    drools: ${RWB_P3_DROOLS:true}
    configservice: ${RWB_P3_CONFIGSERVICE:true}

# Recovery Workbench, local end-to-end stack.
#
#   docker compose up -d                  platform only: Postgres, Temporal, Azurite, mock Entra ID
#   docker compose --profile app up -d    platform plus the backend and frontend containers
#
# Local stand-ins for the bank estate (see README, "Local versus target"):
#   postgres     ACE database (public + recovery) and the two Temporal databases
#   temporal     self-hosted Temporal (target: official Helm chart on ACE AKS, ADR-011)
#   azurite      Azure Blob storage for the document hub (ADR-007)
#   mock-oidc    Entra ID OIDC (target: bank Entra ID tenant with MFA)

name: rwb-e2e

x-postgres-env: &pg-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"

services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      RWB_MIGRATOR_PASSWORD: ${RWB_MIGRATOR_PASSWORD:?set in .env}
      RECOVERY_SVC_PASSWORD: ${RECOVERY_SVC_PASSWORD:?set in .env}
      TEMPORAL_SVC_PASSWORD: ${TEMPORAL_SVC_PASSWORD:?set in .env}
      RWB_ACE_TIER2_PROBE: ${RWB_ACE_TIER2_PROBE:-true}
      RWB_LOAD_REFERENCE_SCHEMA: ${RWB_LOAD_REFERENCE_SCHEMA:-true}
      TZ: Asia/Bangkok
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/schema:/schema:ro
    healthcheck:
      # TCP, not the socket: the init-time server listens on the socket only, so this stays
      # unhealthy until the schema build has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d ace"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal_svc
      POSTGRES_PWD: ${TEMPORAL_SVC_PASSWORD:?set in .env}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      SKIP_DB_CREATE: "true"
      DEFAULT_NAMESPACE: rwb-recovery
      DEFAULT_NAMESPACE_RETENTION: 30d
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./infra/temporal/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname -i):7233 | grep -q SERVING"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal-setup:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: rwb-recovery
    entrypoint: ["/bin/sh", "/setup/setup-namespace.sh"]
    volumes:
      - ./infra/temporal/setup-namespace.sh:/setup/setup-namespace.sh:ro
    restart: "no"

  temporal-ui:
    image: temporalio/ui:2.58.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: rwb-recovery
      TEMPORAL_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8233:8080"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data", "--skipApiVersionCheck"]
    ports:
      - "10000:10000"
    volumes:
      - blobdata:/data

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:7.0.1
    environment:
      SERVER_PORT: "8090"
      JSON_CONFIG_PATH: /config/config.json
    ports:
      - "8090:8090"
    volumes:
      - ./infra/mock-oidc/config.json:/config/config.json:ro

  # ---- application (profile "app") ---------------------------------------------------------
  backend:
    profiles: ["app"]
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      temporal-setup:
        condition: service_completed_successfully
    environment:
      <<: *pg-env
      SPRING_PROFILES_ACTIVE: local
      RWB_ENVIRONMENT: ${RWB_ENVIRONMENT}
      RWB_DB_URL: jdbc:postgresql://postgres:5432/ace
      RECOVERY_SVC_PASSWORD: ${RECOVERY_SVC_PASSWORD}
      RWB_MIGRATOR_PASSWORD: ${RWB_MIGRATOR_PASSWORD}
      RWB_TEMPORAL_TARGET: temporal:7233
      RWB_OIDC_JWKS_URI: http://mock-oidc:8090/entra/jwks
      RWB_OIDC_ISSUER: http://localhost:8090/entra
      RWB_BLOB_CONNECTION_STRING: ${RWB_BLOB_CONNECTION_STRING_DOCKER}
      RWB_TEMPORAL_CODEC_KEY: ${RWB_TEMPORAL_CODEC_KEY:?run scripts/dev.ps1 up to generate}
      RWB_P3_TEMPORAL: ${RWB_P3_TEMPORAL:-true}
      RWB_P3_DROOLS: ${RWB_P3_DROOLS:-true}
    ports:
      - "8080:8080"

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  blobdata:
